# custodian-watch — standalone deploy unit.
#
# The watcher is deliberately NOT in the app's docker-compose.yml: a
# watchdog inside the deploy transaction it watches dies with it (a
# failed `compose up` on go-api leaves the watcher never-started or
# torn down). Deploy this file as its own Coolify app once — it keeps
# running across every app deploy, healthy or failed.
#
# DB mirror is best-effort via the host-published pgbouncer port
# (127.0.0.1:6432 on the host) through host.docker.internal — no shared
# compose network needed, works regardless of the app's project name.
services:
  custodian-watch:
    build:
      context: ..
      dockerfile: custodian-watch/Dockerfile
    container_name: trading-system-custodian-watch
    env_file:
      - path: ../.env
        required: false # alerts/API need the vars, but the watcher itself runs without them
    environment:
      - DATABASE_URL=${WATCH_DATABASE_URL:-postgresql://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading-dev}@host.docker.internal:${PGBOUNCER_PORT:-6432}/${POSTGRES_DB:-trading_system}?sslmode=disable}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - HEALTHCHECKS_URL=${HEALTHCHECKS_URL:-}
      - WATCH_POLL_SECONDS=${WATCH_POLL_SECONDS:-60}
      - DOCKER_HOST=${DOCKER_HOST:-} # tcp://sock-proxy:2375 fallback if the raw sock bind is stripped
      - DOCKER_SOCK=${DOCKER_SOCK:-/var/run/docker.sock}
      - WATCH_PROJECT=${WATCH_PROJECT:-} # pin to one compose project if set
      # no WATCH_PORT — code honors PORT (Coolify may inject the routed
      # port) then falls back to 8100
      - WATCH_TOKEN=${WATCH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach host-loopback pgbouncer
    ports:
      - "${WATCH_HOST_PORT:-8100}:8100" # status API — Bearer WATCH_TOKEN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - custodian_data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "find /data/heartbeat -mmin -3 | grep -q . || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

volumes:
  custodian_data:
    driver: local

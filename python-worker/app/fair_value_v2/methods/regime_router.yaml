version: 1

default_regime: standard

rules:
  - name: bank
    when:
      any:
        - field: category
          eq: financials
        - field: industry
          contains: bank

  # pre-earnings = no earnings AND an actual cash burn to survive.
  # fcf_ttm <= 0 is required: a GAAP-margin-negative name that still
  # self-funds (NET: op margin -9.6% but FCF +$324M) is not a survival
  # candidate — the survival tree priced it at $0.35. Missing FCF data
  # fails the numeric test and falls through to growth/standard cells:
  # 'can't price' is more honest than a fabricated distress value.
  # going-concern escape — a large-cap the street expects to earn
  # money next year is a turnaround, not "pre-earnings". The survival
  # tree is built for speculative growers; it priced INTC ($290B cap,
  # fwd EPS +$1.79, capex-cycle FCF) at $0.21 distress. Placed before
  # pre_earnings so it only catches the names that rule would take.
  - name: standard
    when:
      any:
        - field: eps_ttm
          lte: 0
        - field: operating_margin_ttm
          lte: 0
      all:
        - field: eps_forward
          gte: 0.01
        - field: market_cap
          gte: 50000000000

  - name: pre_earnings
    when:
      any:
        - field: eps_ttm
          lte: 0
        - field: eps_forward
          lte: 0
        - field: operating_margin_ttm
          lte: 0
      all:
        - field: fcf_ttm
          lte: 0

  # profitable but the street forecasts a deep EPS decline — TTM
  # earnings are peak/cycle and deserve a normalized base, not a
  # zero-growth-floored multiple (FRO: -31% fwd growth clamped to 0
  # produced a phantom +76% upside). Placed after pre_earnings (loss
  # makers) and bank (P/B), before the growth regimes — a decliner
  # can't satisfy gte:+25 anyway.
  - name: cyclical
    when:
      all:
        - field: eps_ttm
          gte: 0.25
        - field: forward_growth_pct_1y
          lte: -15

  - name: mega_cap_high_growth
    when:
      all:
        - field: market_cap
          gte: 200000000000
        - field: revenue_growth_ttm
          gte: 0.25

  - name: mega_cap
    when:
      all:
        - field: market_cap
          gte: 200000000000

  - name: high_growth
    when:
      all:
        - field: revenue_growth_ttm
          gte: 0.25

  - name: high_growth
    when:
      all:
        - field: forward_growth_pct_1y
          gte: 25

  - name: standard
    when:
      all:
        - field: always
          eq: true

          contains: semiconductor

  - category: technology
    when:
      all:
        - field: sector
          contains: communication
        - field: industry
          contains: internet

  - category: technology
    when:
      any:
        - field: industry
          contains: social
        - field: industry
          contains: advertising

  - category: technology
    when:
      any:
        - field: industry
          contains: software

  - category: financials
    when:
      any:
        - field: industry
          contains: bank
        - field: industry
          contains: banks

  - category: fintech
    when:
      all:
        - field: sector
          contains: financial
        - field: industry
          contains: credit

  - category: fintech
    when:
      all:
        - field: sector
          contains: financial
        - field: industry
          contains: financial services

  - category: fintech
    when:
      all:
        - field: sector
          contains: financial
        - field: industry
          contains: consumer finance

  - category: fintech
    when:
      all:
        - field: sector
          contains: financial
        - field: industry
          contains: lending

  - category: growth
    when:
      any:
        - field: industry
          contains: internet
        - field: industry
          contains: biotech
        - field: industry
          contains: software

  - category: cyclical
    when:
      any:
        - field: industry
          contains: automotive
        - field: industry
          contains: auto manufacturers
        - field: industry
          contains: auto manufacturer
        - field: industry
          contains: automakers
        - field: industry

method_key: pe_technology_dynamic
version: 2
category: technology
requires:
  scalars:
    - eps_growth_ttm
    - revenue_growth_ttm
    - market_cap
    - operating_margin_ttm
    - tnx_yield
  optional_scalars:
    - forward_growth
    - eps_forward
    - eps_ttm
    - gross_margin_ttm
  series: []
params:
  pe_floor: 10.0
  pe_cap_base: 55.0
  pe_cap_bull: 65.0
  pe_cap_explosive: 75.0

  mega_cap_threshold: 1000000000000.0
  growth_cap_mega: 0.25
  growth_cap_normal: 0.50
  pe_cap_mega: 40.0
  pe_cap_normal: 60.0

  # hardware-economics multiple gate — multi-year gross margin splits
  # manufacturing from platform economics. EMS/assembly (<18% GM:
  # Celestica, Fabrinet) and component/storage hardware (<38% GM:
  # WDC, COHR, VRT) de-rate at peak estimates in a way platform
  # earnings don't; paying a platform multiple on peak-cycle
  # hardware EPS printed fantasy FVs (CLS $847 on 38x FY27)
  ems_gm_threshold: 0.18
  hardware_gm_threshold: 0.38
  pe_cap_ems: 18.0
  pe_cap_hardware: 25.0
  growth_w_mega: 2.0
  growth_w_normal: 3.0

  base_pe: 30.0

  growth_unit: 0.10

  # Note: `tnx_yield` is treated as a percent (e.g. 4.2), not a decimal (0.042).
  rate_neutral: 4.0
  rate_unit: 1.0
  rate_w: -1.0

  margin_neutral: 0.25
  margin_unit: 0.10
  margin_w: 3.0

  bear_mult: 0.75
  bull_mult: 1.15
  explosive_mult: 1.30
  bear_eps_shock: 0.88      # scenarios move EPS too — a bear is an
  bull_eps_shock: 1.06      # earnings miss/beat AND a repriced multiple
  explosive_eps_shock: 1.15
formula:
  bindings:
    # the dynamic multiple embeds growth — it is a forward multiple and
    # belongs on forward earnings when published; trailing is the
    # conservative fallback, not the priced basis
    eps_eff:
      coalesce:
        - {var: eps_forward}
        - {var: eps_ttm}
    # multiple ceiling — the min of the size-tiered cap and the
    # margin-structure gate. Missing GM coalesces to 1.0 (platform
    # economics) so a name without ratio rows keeps the existing caps
    hw_pe_cap:
      min:
        - if:
            cond:
              gt: [{var: market_cap}, {param: mega_cap_threshold}]
            then: {param: pe_cap_mega}
            else: {param: pe_cap_normal}
        - if:
            cond:
              lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: ems_gm_threshold}]
            then: {param: pe_cap_ems}
            else:
              if:
                cond:
                  lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: hardware_gm_threshold}]
                then: {param: pe_cap_hardware}
                else: 999.0
  fair_price:
    if:
      cond:
        lte: [{coalesce: [{var: eps_eff}, -1]}, 0]
      then: null
      else:
        mul:
          - var: eps_eff
          - clamp:
              value:
                add:
                  - param: base_pe
                  - mul:
                      - if:
                          cond:
                            gt: [{var: market_cap}, {param: mega_cap_threshold}]
                          then: {param: growth_w_mega}
                          else: {param: growth_w_normal}
                      - log:
                          add:
                            - 1
                            - div:
                                - add:
                                    - mul:
                                        - 0.5
                                        - coalesce:
                                            - var: forward_growth
                                            - var: revenue_growth_ttm
                                    - mul: [0.3, {var: revenue_growth_ttm}]
                                    - mul:
                                        - 0.2
                                        - min:
                                            - var: eps_growth_ttm
                                            - if:
                                                cond:
                                                  gt: [{var: market_cap}, {param: mega_cap_threshold}]
                                                then: {param: growth_cap_mega}
                                                else: {param: growth_cap_normal}
                                - param: growth_unit
                  - mul:
                      - param: rate_w
                      - div:
                          - sub: [{var: tnx_yield}, {param: rate_neutral}]
                          - param: rate_unit
                  - mul:
                      - param: margin_w
                      - div:
                          - sub: [{var: operating_margin_ttm}, {param: margin_neutral}]
                          - param: margin_unit
              lo: {param: pe_floor}
              hi: {var: hw_pe_cap}

  bear_fair_price:
    if:
      cond:
        lte: [{coalesce: [{var: eps_eff}, -1]}, 0]
      then: null
      else:
        mul:
          - var: eps_eff
          - {param: bear_eps_shock}
          - clamp:
              value:
                mul:
                  - param: bear_mult
                  - add:
                      - param: base_pe
                      - mul:
                          - if:
                              cond:
                                gt: [{var: market_cap}, {param: mega_cap_threshold}]
                              then: {param: growth_w_mega}
                              else: {param: growth_w_normal}
                          - log:
                              add:
                                - 1
                                - div:
                                    - add:
                                        - mul:
                                            - 0.5
                                            - coalesce:
                                                - var: forward_growth
                                                - var: revenue_growth_ttm
                                        - mul: [0.3, {var: revenue_growth_ttm}]
                                        - mul:
                                            - 0.2
                                            - min:
                                                - var: eps_growth_ttm
                                                - if:
                                                    cond:
                                                      gt: [{var: market_cap}, {param: mega_cap_threshold}]
                                                    then: {param: growth_cap_mega}
                                                    else: {param: growth_cap_normal}
                                    - param: growth_unit
                      - mul:
                          - param: rate_w
                          - div:
                              - sub: [{var: tnx_yield}, {param: rate_neutral}]
                              - param: rate_unit
                      - mul:
                          - param: margin_w
                          - div:
                              - sub: [{var: operating_margin_ttm}, {param: margin_neutral}]
                              - param: margin_unit
              lo: {param: pe_floor}
              hi: {var: hw_pe_cap}

  bull_fair_price:
    if:
      cond:
        lte: [{coalesce: [{var: eps_eff}, -1]}, 0]
      then: null
      else:
        mul:
          - var: eps_eff
          - {param: bull_eps_shock}
          - clamp:
              value:
                mul:
                  - param: bull_mult
                  - add:
                      - param: base_pe
                      - mul:
                          - if:
                              cond:
                                gt: [{var: market_cap}, {param: mega_cap_threshold}]
                              then: {param: growth_w_mega}
                              else: {param: growth_w_normal}
                          - log:
                              add:
                                - 1
                                - div:
                                    - add:
                                        - mul:
                                            - 0.5
                                            - coalesce:
                                                - var: forward_growth
                                                - var: revenue_growth_ttm
                                        - mul: [0.3, {var: revenue_growth_ttm}]
                                        - mul:
                                            - 0.2
                                            - min:
                                                - var: eps_growth_ttm
                                                - if:
                                                    cond:
                                                      gt: [{var: market_cap}, {param: mega_cap_threshold}]
                                                    then: {param: growth_cap_mega}
                                                    else: {param: growth_cap_normal}
                                    - param: growth_unit
                      - mul:
                          - param: rate_w
                          - div:
                              - sub: [{var: tnx_yield}, {param: rate_neutral}]
                              - param: rate_unit
                      - mul:
                          - param: margin_w
                          - div:
                              - sub: [{var: operating_margin_ttm}, {param: margin_neutral}]
                              - param: margin_unit
              lo: {param: pe_floor}
              hi: {var: hw_pe_cap}

  explosive_fair_price:
    if:
      cond:
        lte: [{coalesce: [{var: eps_eff}, -1]}, 0]
      then: null
      else:
        mul:
          - var: eps_eff
          - {param: explosive_eps_shock}
          - clamp:
              value:
                mul:
                  - param: explosive_mult
                  - add:
                      - param: base_pe
                      - mul:
                          - if:
                              cond:
                                gt: [{var: market_cap}, {param: mega_cap_threshold}]
                              then: {param: growth_w_mega}
                              else: {param: growth_w_normal}
                          - log:
                              add:
                                - 1
                                - div:
                                    - add:
                                        - mul:
                                            - 0.5
                                            - coalesce:
                                                - var: forward_growth
                                                - var: revenue_growth_ttm
                                        - mul: [0.3, {var: revenue_growth_ttm}]
                                        - mul:
                                            - 0.2
                                            - min:
                                                - var: eps_growth_ttm
                                                - if:
                                                    cond:
                                                      gt: [{var: market_cap}, {param: mega_cap_threshold}]
                                                    then: {param: growth_cap_mega}
                                                    else: {param: growth_cap_normal}
                                    - param: growth_unit
                      - mul:
                          - param: rate_w
                          - div:
                              - sub: [{var: tnx_yield}, {param: rate_neutral}]
                              - param: rate_unit
                      - mul:
                          - param: margin_w
                          - div:
                              - sub: [{var: operating_margin_ttm}, {param: margin_neutral}]
                              - param: margin_unit
              lo: {param: pe_floor}
              hi: {var: hw_pe_cap}
validations:
  - name: margin_impossible
    when: {gt: [{var: operating_margin_ttm}, 1.0]}
    reason: operating margin above 100% of revenue is a data error
  - name: growth_units_suspicious
    when: {gt: [{coalesce: [{var: forward_growth}, 0]}, 10]}
    reason: forward_growth above 10x is a unit mistake or analyst garbage — decimals only
  - name: eps_basis_divergent
    when:
      and:
        - gt: [{coalesce: [{var: eps_ttm}, 0]}, 0]
        - gt: [{coalesce: [{var: eps_forward}, 0]}, 0]
        - or:
            - gt: [{div: [{coalesce: [{var: eps_ttm}, 1]}, {coalesce: [{var: eps_forward}, 1]}]}, 4]
            - gt: [{div: [{coalesce: [{var: eps_forward}, 1]}, {coalesce: [{var: eps_ttm}, 1]}]}, 4]
    reason: "trailing and forward EPS diverge >4x — split-adjusted basis mismatch or stale snapshot, not growth (NOW 5:1 split: eps_ttm 0.23 vs fwd 5.01)"

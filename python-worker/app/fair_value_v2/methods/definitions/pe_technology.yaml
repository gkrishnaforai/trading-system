method_key: pe_technology
version: 2
category: technology
requires:
  scalars:
    - eps_ttm
  optional_scalars:
    - gross_margin_ttm
    - forward_growth_pct_1y
    - eps_forward
  series: []
params:
  # hardware-economics multiple gate — multi-year gross margin splits
  # manufacturing from platform economics; peak-cycle hardware EPS
  # de-rates where platform EPS doesn't
  ems_gm_threshold: 0.18
  hardware_gm_threshold: 0.38
  pe_cap_ems: 18.0
  pe_cap_hardware: 25.0
  pe_floor: 10.0
  pe_cap: 60.0
  pe_at_zero_g: 20.0          # justified PE for a no-growth name
  pe_per_g: 0.5              # +x per point of forward growth
  g_default: 18.0             # used only when no fwd growth exists
  g_cap: 55.0
  bear_eps_shock: 0.85        # bear = EPS miss AND multiple compression
  bear_pe_mult: 0.72
  bull_eps_shock: 1.08
  bull_pe_mult: 1.22
  explosive_eps_shock: 1.18
  explosive_pe_mult: 1.55
formula:
  bindings:
    hw_pe_cap:
      if:
        cond:
          lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: ems_gm_threshold}]
        then: {param: pe_cap_ems}
        else:
          if:
            cond:
              lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: hardware_gm_threshold}]
            then: {param: pe_cap_hardware}
            else: 999.0
    g:
      clamp:
        value:
          coalesce: [{var: forward_growth_pct_1y}, {param: g_default}]
        lo: 0
        hi: {param: g_cap}
    pe_base:
      clamp:
        value:
          add: [{param: pe_at_zero_g}, {mul: [{param: pe_per_g}, {var: g}]}]
        lo: {param: pe_floor}
        hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
    pe_bear:
      clamp:
        value: {mul: [{var: pe_base}, {param: bear_pe_mult}]}
        lo: {param: pe_floor}
        hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
    pe_bull:
      clamp:
        value: {mul: [{var: pe_base}, {param: bull_pe_mult}]}
        lo: {param: pe_floor}
        hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
    pe_explosive:
      clamp:
        value: {mul: [{var: pe_base}, {param: explosive_pe_mult}]}
        lo: {param: pe_floor}
        hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
  fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul: [{var: eps_ttm}, {var: pe_base}]
  bear_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul: [{var: eps_ttm}, {param: bear_eps_shock}, {var: pe_bear}]
  bull_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul: [{var: eps_ttm}, {param: bull_eps_shock}, {var: pe_bull}]
  explosive_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul: [{var: eps_ttm}, {param: explosive_eps_shock}, {var: pe_explosive}]
validations:
  - name: eps_basis_divergent
    when:
      and:
        - gt: [{coalesce: [{var: eps_ttm}, 0]}, 0]
        - gt: [{coalesce: [{var: eps_forward}, 0]}, 0]
        - or:
            - gt: [{div: [{coalesce: [{var: eps_ttm}, 1]}, {coalesce: [{var: eps_forward}, 1]}]}, 4]
            - gt: [{div: [{coalesce: [{var: eps_forward}, 1]}, {coalesce: [{var: eps_ttm}, 1]}]}, 4]
    reason: "trailing and forward EPS diverge >4x — split-adjusted basis mismatch or stale snapshot, not growth"

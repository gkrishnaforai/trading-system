method_key: pe_value
version: 1
category: value
requires:
  scalars:
    - eps_ttm
  series: []
params:
  pe_floor: 5.0
  pe_cap: 30.0
  base_pe: 18.0
  bear_pe: 14.0
  bull_pe: 22.0
  explosive_pe: 28.0
formula:
  fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul:
          - var: eps_ttm
          - clamp:
              value: {param: base_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  bear_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul:
          - var: eps_ttm
          - clamp:
              value: {param: bear_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  bull_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul:
          - var: eps_ttm
          - clamp:
              value: {param: bull_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  explosive_fair_price:
    if:
      cond:
        lte: [{var: eps_ttm}, 0]
      then: null
      else:
        mul:
          - var: eps_ttm
          - clamp:
              value: {param: explosive_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
validations: []

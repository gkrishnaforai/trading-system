method_key: peg_40
version: 1
category: growth
requires:
  scalars:
    - eps_forward
    - forward_growth_pct_1y
    - operating_margin_ttm
  optional_scalars:
    - gross_margin_ttm
  series: []
params:
  peg_40_target: 1.1
  pe_floor: 15.0
  pe_cap: 50.0
  pe_cap_bear: 40.0
  pe_cap_bull: 60.0
  pe_cap_explosive: 70.0
  # hardware-economics multiple gate — multi-year gross margin splits
  # manufacturing from platform economics; peak-cycle hardware EPS
  # de-rates where platform EPS doesn't
  ems_gm_threshold: 0.18
  hardware_gm_threshold: 0.38
  pe_cap_ems: 18.0
  pe_cap_hardware: 25.0
  growth_pct_cap: 60.0
  margin_pct_floor: 0.0
  margin_pct_cap: 60.0
  bear_mult: 0.8
  bull_mult: 1.15
  explosive_mult: 1.3
formula:
  bindings:
    hw_pe_cap:
      if:
        cond:
          lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: ems_gm_threshold}]
        then: {param: pe_cap_ems}
        else:
          if:
            cond:
              lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: hardware_gm_threshold}]
            then: {param: pe_cap_hardware}
            else: 999.0
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        let:
          bindings:
            g:
              clamp:
                value: {var: forward_growth_pct_1y}
                lo: 0
                hi: {param: growth_pct_cap}
            m:
              clamp:
                value: {mul: [100, {var: operating_margin_ttm}]}
                lo: {param: margin_pct_floor}
                hi: {param: margin_pct_cap}
            score:
              add: [{var: g}, {var: m}]
            pe:
              clamp:
                value:
                  mul: [{param: peg_40_target}, {var: score}]
                lo: {param: pe_floor}
                hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
          in:
            mul: [{var: eps_forward}, {var: pe}]
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        let:
          bindings:
            g:
              clamp:
                value: {var: forward_growth_pct_1y}
                lo: 0
                hi: {param: growth_pct_cap}
            m:
              clamp:
                value: {mul: [100, {var: operating_margin_ttm}]}
                lo: {param: margin_pct_floor}
                hi: {param: margin_pct_cap}
            score:
              add: [{var: g}, {var: m}]
            pe:
              clamp:
                value:
                  mul:
                    - {param: bear_mult}
                    - mul: [{param: peg_40_target}, {var: score}]
                lo: {param: pe_floor}
                hi: {min: [{param: pe_cap_bear}, {var: hw_pe_cap}]}
          in:
            mul: [{var: eps_forward}, {var: pe}]
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        let:
          bindings:
            g:
              clamp:
                value: {var: forward_growth_pct_1y}
                lo: 0
                hi: {param: growth_pct_cap}
            m:
              clamp:
                value: {mul: [100, {var: operating_margin_ttm}]}
                lo: {param: margin_pct_floor}
                hi: {param: margin_pct_cap}
            score:
              add: [{var: g}, {var: m}]
            pe:
              clamp:
                value:
                  mul:
                    - {param: bull_mult}
                    - mul: [{param: peg_40_target}, {var: score}]
                lo: {param: pe_floor}
                hi: {min: [{param: pe_cap_bull}, {var: hw_pe_cap}]}
          in:
            mul: [{var: eps_forward}, {var: pe}]
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        let:
          bindings:
            g:
              clamp:
                value: {var: forward_growth_pct_1y}
                lo: 0
                hi: {param: growth_pct_cap}
            m:
              clamp:
                value: {mul: [100, {var: operating_margin_ttm}]}
                lo: {param: margin_pct_floor}
                hi: {param: margin_pct_cap}
            score:
              add: [{var: g}, {var: m}]
            pe:
              clamp:
                value:
                  mul:
                    - {param: explosive_mult}
                    - mul: [{param: peg_40_target}, {var: score}]
                lo: {param: pe_floor}
                hi: {min: [{param: pe_cap_explosive}, {var: hw_pe_cap}]}
          in:
            mul: [{var: eps_forward}, {var: pe}]
validations: []

method_key: peg_corrected
version: 1
category: growth
requires:
  scalars:
    - eps_forward
    - forward_growth_pct_1y
  optional_scalars:
    - eps_ttm
  series: []
params:
  peg_target: 0.9
  pe_floor: 15.0
  pe_floor_bear: 15.0
  pe_floor_base: 15.0
  pe_floor_bull: 15.0
  pe_floor_explosive: 15.0
  pe_cap: 30.0
  growth_pct_cap: 50.0
  growth_mult_bear: 0.70
  growth_mult_bull: 1.10
  growth_mult_explosive: 1.25
  pe_cap_bear: 25.0
  pe_cap_bull: 40.0
  pe_cap_explosive: 45.0
formula:
  bindings:
    g_raw: {var: forward_growth_pct_1y}
    g:
      clamp:
        value: {var: g_raw}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bear:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bear}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bull:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bull}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_explosive:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_explosive}]}
        lo: 0
        hi: {param: growth_pct_cap}
    pe_base:
      clamp:
        value:
          mul:
            - {param: peg_target}
            - {var: g}
        lo: {param: pe_floor_base}
        hi: {param: pe_cap}
    pe_bear:
      clamp:
        value:
          mul:
            - {param: peg_target}
            - {var: g_bear}
        lo: {param: pe_floor_bear}
        hi: {param: pe_cap_bear}
    pe_bull:
      clamp:
        value:
          mul:
            - {param: peg_target}
            - {var: g_bull}
        lo: {param: pe_floor_bull}
        hi: {param: pe_cap_bull}
    pe_explosive:
      clamp:
        value:
          mul:
            - {param: peg_target}
            - {var: g_explosive}
        lo: {param: pe_floor_explosive}
        hi: {param: pe_cap_explosive}
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul: [{var: eps_forward}, {var: pe_base}]
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul: [{var: eps_forward}, {var: pe_bear}]
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul: [{var: eps_forward}, {var: pe_bull}]
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul: [{var: eps_forward}, {var: pe_explosive}]
validations: []

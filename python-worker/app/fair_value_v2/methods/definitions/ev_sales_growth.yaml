method_key: ev_sales_growth
version: 3
category: growth
requires:
  scalars:
    - revenue_ttm
    - shares_outstanding
    - cash_and_equivalents
    - revenue_growth_ttm
  optional_scalars:
    - net_profit_margin_ttm
    - net_profit_margin_midcycle
    - operating_margin_ttm
    - fcf_ttm
    - revenue_forward
    - total_debt
    - shares_diluted
  series: []
params:
  # EV/S is anchored through the identity EV/S ≈ implied P/E × net margin:
  # revenue growth only earns a sales multiple in proportion to the margin
  # it can eventually convert to earnings. A 14x EV/S on a 2%-margin airline
  # or a negative-margin pre-earnings name is a value trap, not a signal.
  pe_base: 12.0
  pe_g_weight: 40.0
  pe_floor: 8.0
  pe_cap: 45.0
  pe_cap_bear: 30.0
  pe_cap_bull: 50.0
  pe_cap_explosive: 55.0
  g_cap: 0.50
  bear_g_mult: 0.5
  bull_g_mult: 1.15
  explosive_g_mult: 1.3
  # quality anchor — net margin preferred (full economics incl. interest);
  # operating margin is a fallback proxy haircut to approximate net.
  # margin_floor is the "minimum viable margin" assumption for pre-earnings
  # names: the method's premise is that revenue eventually converts at some
  # positive margin — the net-debt bridge still kills unsustainable names.
  margin_default: 0.10
  margin_floor: 0.03
  margin_cap: 0.60
  op_margin_haircut: 0.75
  # contracted-ramp names (neoclouds et al.): when forward consensus
  # revenue runs well ahead of trailing sales, the sales base is the
  # forward number and the margin floor rises to a normalized-ramp
  # level — a negative TTM margin reflects buildout D&A/interest, not
  # the unit economics the contracted backlog converts at.
  ramp_ratio: 1.5
  margin_floor_ramp: 0.10
  # scenario differentiation on the revenue axis: once g saturates g_cap
  # the multiple legs collapse to identical values — bull/explosive for a
  # ramping name means faster capacity conversion, i.e. more recognized
  # revenue, not just a higher multiple on the same sales base.
  sales_bear_mult: 0.85
  sales_bull_mult: 1.10
  sales_explosive_mult: 1.25
  # forward revenue running >3x trailing is ARR-flavoured extrapolation,
  # not next-FY recognized revenue — flag it rather than silently trust it
  forward_rev_max_ratio: 3.0
formula:
  bindings:
    # EV->equity bridge: the multiple produces enterprise value, so
    # equity = EV + cash - debt (levered FCF nets interest, never
    # principal). Price on diluted shares when the data exists.
    debt_eff: {max: [{coalesce: [{var: total_debt}, 0]}, 0]}
    shares_eff:
      if:
        cond: {gt: [{coalesce: [{var: shares_diluted}, 0]}, 0]}
        then: {var: shares_diluted}
        else: {var: shares_outstanding}
    # sales base: forward consensus when published (point-in-time,
    # nearest unreported FY), else trailing. This is what turns
    # NBIS-class names from 'broken' into 'conservative but sane'.
    sales_base:
      coalesce:
        - {var: revenue_forward}
        - {var: revenue_ttm}
    # ARR-vs-recognized check: flag_* bindings land in metrics.flags and
    # are promoted to run quality_flags by the runner
    flag_forward_revenue_inflated:
      if:
        cond: {gt: [{coalesce: [{var: revenue_ttm}, 0]}, 0]}
        then:
          gte:
            - div: [{var: sales_base}, {var: revenue_ttm}]
            - param: forward_rev_max_ratio
        else: {const: false}
    # per-scenario revenue: downside = slower conversion, upside = faster
    # ramp. Keeps bear < base < bull < explosive when g saturates g_cap.
    sales_bear: {mul: [{var: sales_base}, {param: sales_bear_mult}]}
    sales_bull: {mul: [{var: sales_base}, {param: sales_bull_mult}]}
    sales_explosive: {mul: [{var: sales_base}, {param: sales_explosive_mult}]}
    g:
      clamp:
        value: {var: revenue_growth_ttm}
        lo: 0
        hi: {param: g_cap}
    g_bear: {mul: [{var: g}, {param: bear_g_mult}]}
    g_bull:
      min: [{mul: [{var: g}, {param: bull_g_mult}]}, {param: g_cap}]
    g_explosive:
      min: [{mul: [{var: g}, {param: explosive_g_mult}]}, {param: g_cap}]
    # take the BETTER of accrual vs cash margin: GAAP net margin understates
    # high-SBC growers (ZS: net -3% but FCF +25%); a liquidating company can
    # show inflated FCF but the net-debt bridge and multiple caps bound that
    margin_net:
      coalesce:
        - {var: net_profit_margin_ttm}
        - {mul: [{var: operating_margin_ttm}, {param: op_margin_haircut}]}
        - {param: margin_default}
    margin_fcf:
      coalesce:
        - {div: [{var: fcf_ttm}, {var: revenue_ttm}]}
        - {param: margin_default}
    margin_raw: {max: [{var: margin_net}, {var: margin_fcf}]}
    # midcycle comes off financial_ratios which carries corrupt rows for
    # some names (NBIS: +5523%/-700% printed) — clamp to a sane band
    # before it can lift or sink the normalised margin
    midcycle_clamped:
      clamp:
        value:
          coalesce: [{var: net_profit_margin_midcycle}, {var: margin_raw}]
        lo: -3.0
        hi: 1.0
    margin_norm:
      min:
        - var: margin_raw
        - div:
            - add:
                - var: margin_raw
                - var: midcycle_clamped
            - 2
    # ramp-aware floor: nested ifs (and: is eager, div raises on 0) —
    # only when forward sales exist AND run >= ramp_ratio ahead of TTM
    # does the negative-margin floor move to the ramp level.
    margin_floor_eff:
      if:
        cond: {gt: [{var: revenue_ttm}, 0]}
        then:
          if:
            cond:
              gte: [{div: [{var: sales_base}, {var: revenue_ttm}]},
                    {param: ramp_ratio}]
            then: {param: margin_floor_ramp}
            else: {param: margin_floor}
        else: {param: margin_floor}
    # the floor is a pre-earnings benefit-of-doubt ONLY — a real positive
    # margin, however thin, is kept as-is (flooring a 0.3% distributor to
    # 3% would inflate its revenue-heavy base 10x)
    margin_src:
      if:
        cond: {lt: [{var: margin_norm}, 0]}
        then: {var: margin_floor_eff}
        else: {min: [{var: margin_norm}, {param: margin_cap}]}
    pe_base_scenario:
      clamp:
        value:
          add: [{param: pe_base}, {mul: [{param: pe_g_weight}, {var: g}]}]
        lo: {param: pe_floor}
        hi: {param: pe_cap}
    pe_bear_scenario:
      clamp:
        value:
          add:
            - mul: [{param: pe_base}, 0.7]
            - mul: [{param: pe_g_weight}, {var: g_bear}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_bear}
    pe_bull_scenario:
      clamp:
        value:
          add: [{param: pe_base}, {mul: [{param: pe_g_weight}, {var: g_bull}]}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_bull}
    pe_explosive_scenario:
      clamp:
        value:
          add:
            - mul: [{param: pe_base}, 1.2]
            - mul: [{param: pe_g_weight}, {var: g_explosive}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_explosive}
    evs_base: {mul: [{var: pe_base_scenario}, {var: margin_src}]}
    evs_bear: {mul: [{var: pe_bear_scenario}, {var: margin_src}]}
    evs_bull: {mul: [{var: pe_bull_scenario}, {var: margin_src}]}
    evs_explosive: {mul: [{var: pe_explosive_scenario}, {var: margin_src}]}
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: sales_base}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - sub:
              - add: [{mul: [{var: sales_base}, {var: evs_base}]}, {var: cash_and_equivalents}]
              - var: debt_eff
          - var: shares_eff
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: sales_base}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - sub:
              - add: [{mul: [{var: sales_bear}, {var: evs_bear}]}, {var: cash_and_equivalents}]
              - var: debt_eff
          - var: shares_eff
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: sales_base}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - sub:
              - add: [{mul: [{var: sales_bull}, {var: evs_bull}]}, {var: cash_and_equivalents}]
              - var: debt_eff
          - var: shares_eff
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: sales_base}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - sub:
              - add: [{mul: [{var: sales_explosive}, {var: evs_explosive}]}, {var: cash_and_equivalents}]
              - var: debt_eff
          - var: shares_eff
validations:
  # optional inputs coalesce to a non-triggering value — a missing
  # optional must not crash the contract check
  - name: margin_impossible
    when: {or: [{gt: [{coalesce: [{var: net_profit_margin_ttm}, 0]}, 1.0]}, {gt: [{coalesce: [{var: operating_margin_ttm}, 0]}, 1.0]}]}
    reason: a margin above 100% of revenue is a data error, not a business

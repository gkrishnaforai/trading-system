method_key: ev_sales_fintech
version: 2
category: fintech
requires:
  scalars:
    - revenue_ttm
    - shares_outstanding
    - cash_and_equivalents
    - revenue_growth_ttm
  optional_scalars:
    - net_profit_margin_ttm
    - operating_margin_ttm
    - fcf_ttm
  series: []
params:
  # same EV/S ≈ implied P/E × net margin identity as ev_sales_growth,
  # with fintech-appropriate multiple bounds (capital-light but
  # margin-constrained business models)
  pe_base: 10.0
  pe_g_weight: 25.0
  pe_floor: 8.0
  pe_cap: 35.0
  pe_cap_bear: 22.0
  pe_cap_bull: 40.0
  pe_cap_explosive: 45.0
  g_cap: 0.50
  bear_g_mult: 0.5
  bull_g_mult: 1.15
  explosive_g_mult: 1.3
  margin_default: 0.10
  margin_floor: 0.03
  margin_cap: 0.60
  op_margin_haircut: 0.75
formula:
  bindings:
    g:
      clamp:
        value: {var: revenue_growth_ttm}
        lo: 0
        hi: {param: g_cap}
    g_bear: {mul: [{var: g}, {param: bear_g_mult}]}
    g_bull:
      min: [{mul: [{var: g}, {param: bull_g_mult}]}, {param: g_cap}]
    g_explosive:
      min: [{mul: [{var: g}, {param: explosive_g_mult}]}, {param: g_cap}]
    margin_net:
      coalesce:
        - {var: net_profit_margin_ttm}
        - {mul: [{var: operating_margin_ttm}, {param: op_margin_haircut}]}
        - {param: margin_default}
    margin_fcf:
      coalesce:
        - {div: [{var: fcf_ttm}, {var: revenue_ttm}]}
        - {param: margin_default}
    margin_raw: {max: [{var: margin_net}, {var: margin_fcf}]}
    margin_src:
      if:
        cond: {lt: [{var: margin_raw}, 0]}
        then: {param: margin_floor}
        else: {min: [{var: margin_raw}, {param: margin_cap}]}
    pe_base_scenario:
      clamp:
        value:
          add: [{param: pe_base}, {mul: [{param: pe_g_weight}, {var: g}]}]
        lo: {param: pe_floor}
        hi: {param: pe_cap}
    pe_bear_scenario:
      clamp:
        value:
          add:
            - mul: [{param: pe_base}, 0.7]
            - mul: [{param: pe_g_weight}, {var: g_bear}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_bear}
    pe_bull_scenario:
      clamp:
        value:
          add: [{param: pe_base}, {mul: [{param: pe_g_weight}, {var: g_bull}]}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_bull}
    pe_explosive_scenario:
      clamp:
        value:
          add:
            - mul: [{param: pe_base}, 1.2]
            - mul: [{param: pe_g_weight}, {var: g_explosive}]
        lo: {param: pe_floor}
        hi: {param: pe_cap_explosive}
    evs_base: {mul: [{var: pe_base_scenario}, {var: margin_src}]}
    evs_bear: {mul: [{var: pe_bear_scenario}, {var: margin_src}]}
    evs_bull: {mul: [{var: pe_bull_scenario}, {var: margin_src}]}
    evs_explosive: {mul: [{var: pe_explosive_scenario}, {var: margin_src}]}
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: revenue_ttm}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - add: [{mul: [{var: revenue_ttm}, {var: evs_base}]}, {var: cash_and_equivalents}]
          - var: shares_outstanding
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: revenue_ttm}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - add: [{mul: [{var: revenue_ttm}, {var: evs_bear}]}, {var: cash_and_equivalents}]
          - var: shares_outstanding
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: revenue_ttm}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - add: [{mul: [{var: revenue_ttm}, {var: evs_bull}]}, {var: cash_and_equivalents}]
          - var: shares_outstanding
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: revenue_ttm}, 0]
          - lte: [{var: shares_outstanding}, 0]
      then: null
      else:
        div:
          - add: [{mul: [{var: revenue_ttm}, {var: evs_explosive}]}, {var: cash_and_equivalents}]
          - var: shares_outstanding
validations: []

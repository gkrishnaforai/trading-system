method_key: peg
version: 2
category: growth
requires:
  scalars:
    - eps_forward
    - forward_growth_pct_1y
  optional_scalars:
    - eps_ttm
  series: []
params:
  peg_target: 1.2
  pe_floor: 15.0
  pe_cap: 45.0
  pe_cap_bear: 35.0
  pe_cap_bull: 55.0
  pe_cap_explosive: 65.0
  growth_pct_cap: 60.0
  growth_mult_bear: 0.70
  growth_mult_bull: 1.10
  growth_mult_explosive: 1.25
formula:
  bindings:
    g:
      clamp:
        value: {var: forward_growth_pct_1y}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bear:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bear}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bull:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bull}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_explosive:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_explosive}]}
        lo: 0
        hi: {param: growth_pct_cap}
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g}]}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_bear}]}
              lo: {param: pe_floor}
              hi: {param: pe_cap_bear}
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_bull}]}
              lo: {param: pe_floor}
              hi: {param: pe_cap_bull}
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_explosive}]}
              lo: {param: pe_floor}
              hi: {param: pe_cap_explosive}
validations:
  - name: growth_pct_not_decimal
    when: {gt: [{var: forward_growth_pct_1y}, 300]}
    reason: forward_growth_pct_1y looks like a decimal (>300) or analyst garbage — reject rather than price it

method_key: peg
version: 2
category: growth
requires:
  scalars:
    - eps_forward
    - forward_growth_pct_1y
  optional_scalars:
    - gross_margin_ttm
  series: []
params:
  # hardware-economics multiple gate — multi-year gross margin splits
  # manufacturing from platform economics; peak-cycle hardware EPS
  # de-rates where platform EPS doesn't
  ems_gm_threshold: 0.18
  hardware_gm_threshold: 0.38
  pe_cap_ems: 18.0
  pe_cap_hardware: 25.0
  peg_target: 1.2
  pe_floor: 15.0
  pe_cap: 45.0
  pe_cap_bear: 35.0
  pe_cap_bull: 55.0
  pe_cap_explosive: 65.0
  growth_pct_cap: 60.0
  growth_mult_bear: 0.70
  growth_mult_bull: 1.10
  growth_mult_explosive: 1.25
formula:
  bindings:
    hw_pe_cap:
      if:
        cond:
          lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: ems_gm_threshold}]
        then: {param: pe_cap_ems}
        else:
          if:
            cond:
              lt: [{coalesce: [{var: gross_margin_ttm}, 1.0]}, {param: hardware_gm_threshold}]
            then: {param: pe_cap_hardware}
            else: 999.0
    g:
      clamp:
        value: {var: forward_growth_pct_1y}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bear:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bear}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_bull:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_bull}]}
        lo: 0
        hi: {param: growth_pct_cap}
    g_explosive:
      clamp:
        value: {mul: [{var: g}, {param: growth_mult_explosive}]}
        lo: 0
        hi: {param: growth_pct_cap}
  fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g}]}
              lo: {param: pe_floor}
              hi: {min: [{param: pe_cap}, {var: hw_pe_cap}]}
  bear_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_bear}]}
              lo: {param: pe_floor}
              hi: {min: [{param: pe_cap_bear}, {var: hw_pe_cap}]}
  bull_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_bull}]}
              lo: {param: pe_floor}
              hi: {min: [{param: pe_cap_bull}, {var: hw_pe_cap}]}
  explosive_fair_price:
    if:
      cond:
        or:
          - lte: [{var: eps_forward}, 0]
          - lte: [{var: forward_growth_pct_1y}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {mul: [{param: peg_target}, {var: g_explosive}]}
              lo: {param: pe_floor}
              hi: {min: [{param: pe_cap_explosive}, {var: hw_pe_cap}]}
validations:
  - name: growth_pct_not_decimal
    when: {gt: [{var: forward_growth_pct_1y}, 300]}
    reason: forward_growth_pct_1y looks like a decimal (>300) or analyst garbage — reject rather than price it

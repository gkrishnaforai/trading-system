method_key: pe_forward
version: 1
category: general
requires:
  scalars:
    - eps_forward
  series: []
params:
  pe_floor: 6.0
  pe_cap: 60.0
  base_pe: 28.0
  bear_pe: 22.0
  bull_pe: 36.0
  explosive_pe: 48.0
formula:
  fair_price:
    if:
      cond:
        lte: [{var: eps_forward}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {param: base_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  bear_fair_price:
    if:
      cond:
        lte: [{var: eps_forward}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {param: bear_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  bull_fair_price:
    if:
      cond:
        lte: [{var: eps_forward}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {param: bull_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
  explosive_fair_price:
    if:
      cond:
        lte: [{var: eps_forward}, 0]
      then: null
      else:
        mul:
          - var: eps_forward
          - clamp:
              value: {param: explosive_pe}
              lo: {param: pe_floor}
              hi: {param: pe_cap}
validations: []

version: 1

# Explicit allowlist for SQL identifiers used by `table_column` sources.
# This keeps feature sourcing editable in YAML while preventing arbitrary table/column access.
allow_table_columns:
  financial_ratios:
    as_of_columns: [fiscal_date_ending]
    columns: [roe, operating_margin, net_profit_margin]
  consensus_data:
    as_of_columns: [consensus_date]
    columns: [consensus_price_target, price_target_high, price_target_low, analyst_count]
  income_statements:
    as_of_columns: [fiscal_date_ending]
    columns: [total_revenue, net_income]
  fundamental_quarterly:
    as_of_columns: [filing_date]
    columns: [shares_diluted]
  share_float:
    as_of_columns: [float_date]
    columns: [shares_outstanding]
  balance_sheets:
    as_of_columns: [fiscal_date_ending]
    columns: [cash_and_cash_equivalents, long_term_debt, total_shareholder_equity]
  cash_flow_statements:
    as_of_columns: [fiscal_date_ending]
    columns: [operating_cash_flow, free_cash_flow, capital_expenditures]
  raw_market_data_intraday:
    as_of_columns: [ts]
    columns: [close, interval]
  fmp_real_time_prices:
    as_of_columns: [price_timestamp, created_at, updated_at]
    columns: [price]

allow_macro_columns:
  as_of_columns: [data_date]
  columns: [tnx_yield, irx_yield, yield_curve_spread, vix_close]

# Safe, constrained feature sourcing DSL.
# Each scalar feature declares how it is obtained.
# Sources supported by the resolver:
# - snapshot_json: read from stock_insights_snapshots payload JSON
# - table_column: read a scalar column from a table with point-in-time filtering
# - derived: safe built-in derivations using other features
#
# Fixing feature issues should be possible by editing this YAML (keys, fallbacks, derivations).

# Unit contract — every scalar feature is one of:
#   usd_per_share  dollars per share (eps, targets, bvps)
#   usd            absolute dollars (revenue, fcf, cash, market_cap)
#   decimal        fraction (0.15 = 15%)
#   percent        percentage points (15 = 15%) — name MUST end _pct*
#   count          shares / analysts / years
# The convention is load-bearing: `pe_per_g` params price percent points;
# `growth_weight`/`growth_cap` params price decimals. A unit mismatch is a
# silent 100x error — tests/test_fv_units.py enforces this manifest.
units:
  book_value_per_share: usd_per_share
  roe: decimal
  eps_ttm: usd_per_share
  eps_ttm_implied: usd_per_share
  eps_forward: usd_per_share
  eps_growth_ttm: decimal
  operating_margin_ttm: decimal
  net_profit_margin_ttm: decimal
  net_profit_margin_midcycle: decimal
  revenue_growth_ttm: decimal
  consensus_price_target: usd_per_share
  price_target_high: usd_per_share
  price_target_low: usd_per_share
  analyst_count: count
  market_cap: usd
  shares_outstanding: count
  shares_diluted: count
  shares_basic: count
  dilution_overhang: decimal
  revenue_ttm: usd
  revenue_forward: usd
  eps_est_start: usd_per_share
  eps_est_end: usd_per_share
  eps_est_years: count
  eps_est_analysts: count
  ocf_ttm: usd
  net_income_ttm: usd
  cash_conversion: decimal
  fcf_ttm: usd
  cash_and_equivalents: usd
  total_debt: usd
  forward_growth: decimal
  forward_growth_pct_1y: percent
  spot_price: usd_per_share
  tnx_yield: percent

features:
  book_value_per_share:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json
        source: fmp_key_metrics_ttm
        json_root: key_metrics_ttm
        keys:
          - bookValuePerShareTTM
          - bookValueperShareTTM
          - tangibleBookValuePerShareTTM
          - tangibleBookValueperShareTTM
          - bookValuePerShare
          - bookValueperShare
          - tangibleBookValuePerShare
          - tangibleBookValueperShare
      - type: derived
        name: ratio
        params:
          numerator:
            type: coalesce
            sources:
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, statements, balance, 0, totalStockholdersEquity]
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, statements, balance, 0, totalEquity]
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, statements, balance, 0, stockholdersEquity]
              - type: table_column
                table: balance_sheets
                column: total_shareholder_equity
                as_of: fiscal_date_ending
                order_by: fiscal_date_ending
                where_not_null: true
          denominator:
            type: feature_ref
            name: shares_outstanding

  roe:
    type: coalesce
    max_age_days: 400
    sources:
      - type: table_column
        table: financial_ratios
        column: roe
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true
      - type: snapshot_json
        source: fmp_key_metrics_ttm
        json_root: key_metrics_ttm
        keys:
          - roeTTM
          - returnOnEquityTTM
          - roe
          - returnOnEquity

  eps_ttm:
    type: coalesce
    max_age_days: 150
    sources:
      - type: snapshot_json
        source: fmp_key_metrics_ttm
        json_root: key_metrics_ttm
        keys:
          - netIncomePerShareTTM
          - epsTTM
          - epsDilutedTTM
          - eps
          - netIncomePerShare
          - netIncomePerShareTTM
          - earningsPerShareTTM
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, eps_trailing]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, eps]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, epsDiluted]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, eps]
      - type: derived
        name: price_div_pe
        params:
          price:
            type: coalesce
            max_age_days: 21
            sources:
              - type: table_column
                max_age_days: 14
                table: raw_market_data_intraday
                column: close
                as_of: ts
                order_by: ts
                where_not_null: true
                where:
                  interval: last
              - type: table_column
                max_age_days: 14
                table: fmp_real_time_prices
                column: price
                as_of: created_at
                order_by: created_at
                where_not_null: true
              - type: snapshot_json
                source: fmp_quote
                json_root: quote
                keys: [price]
          pe:
            type: coalesce
            max_age_days: 21
            sources:
              - type: snapshot_json
                source: fmp_key_metrics_ttm
                json_root: key_metrics_ttm
                keys:
                  - peRatioTTM
                  - peRatio
                  - trailingPE
                  - priceEarningsRatio
                  - priceEarningsRatioTTM
                  - peTTM
              - type: derived
                name: inv_earnings_yield
                params:
                  earnings_yield:
                    type: snapshot_json
                    max_age_days: 21
                    source: fmp_key_metrics_ttm
                    json_root: key_metrics_ttm
                    keys: [earningsYieldTTM]

  eps_ttm_implied:
    type: derived
    max_age_days: 150
    name: price_div_pe
    params:
      price:
        type: coalesce
        max_age_days: 21
        sources:
          - type: table_column
            table: raw_market_data_intraday
            column: close
            as_of: ts
            order_by: ts
            where_not_null: true
            where:
              interval: last
          - type: table_column
            table: fmp_real_time_prices
            column: price
            as_of: created_at
            order_by: created_at
            where_not_null: true
          - type: snapshot_json
            source: fmp_quote
            json_root: quote
            keys: [price]
      pe:
        type: coalesce
        max_age_days: 21
        sources:
          - type: snapshot_json
            source: fmp_key_metrics_ttm
            json_root: key_metrics_ttm
            keys:
              - peRatioTTM
              - peRatio
              - trailingPE
              - priceEarningsRatio
              - priceEarningsRatioTTM
              - peTTM
          - type: derived
            name: inv_earnings_yield
            params:
              earnings_yield:
                type: snapshot_json
                max_age_days: 21
                source: fmp_key_metrics_ttm
                json_root: key_metrics_ttm
                keys: [earningsYieldTTM]

  spot_price:
    type: coalesce
    max_age_days: 21
    sources:
      - type: table_column
        table: raw_market_data_intraday
        column: close
        as_of: ts
        order_by: ts
        where_not_null: true
        where:
          interval: last
      - type: table_column
        table: fmp_real_time_prices
        column: price
        as_of: created_at
        order_by: created_at
        where_not_null: true
      - type: snapshot_json
        source: fmp_quote
        json_root: quote
        keys: [price]

  eps_forward:
    type: coalesce
    max_age_days: 180
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, eps_forward]
      - type: snapshot_json
        source: fmp_key_metrics_ttm
        json_root: key_metrics_ttm
        keys:
          - epsForward
          - epsForwardTTM
          - epsNextYear
          - epsEstimatedNextYear

  eps_growth_ttm:
    type: snapshot_json
    max_age_days: 150
    source: fmp_financial_growth
    json_root: financial_growth
    keys:
      - epsgrowth
      - epsGrowth
      - epsGrowthTTM
      - growthEPS
      - growthEPSDiluted

  operating_margin_ttm:
    type: table_column
    max_age_days: 400
    table: financial_ratios
    column: operating_margin
    as_of: fiscal_date_ending
    order_by: fiscal_date_ending
    where_not_null: true

  net_profit_margin_ttm:
    type: table_column
    max_age_days: 400
    table: financial_ratios
    column: net_profit_margin
    as_of: fiscal_date_ending
    order_by: fiscal_date_ending
    where_not_null: true

  revenue_growth_ttm:
    type: snapshot_json
    max_age_days: 150
    source: fmp_financial_growth
    json_root: financial_growth
    keys:
      - revenueGrowth
      - revenueGrowthTTM
      - revenuegrowth

  consensus_price_target:
    type: table_column
    max_age_days: 240
    table: consensus_data
    column: consensus_price_target
    as_of: consensus_date
    order_by: consensus_date
    where_not_null: true

  price_target_high:
    type: table_column
    max_age_days: 240
    table: consensus_data
    column: price_target_high
    as_of: consensus_date
    order_by: consensus_date
    where_not_null: true

  price_target_low:
    type: table_column
    max_age_days: 240
    table: consensus_data
    column: price_target_low
    as_of: consensus_date
    order_by: consensus_date
    where_not_null: true

  analyst_count:
    type: table_column
    max_age_days: 240
    table: consensus_data
    column: analyst_count
    as_of: consensus_date
    order_by: consensus_date
    where_not_null: false

  market_cap:
    type: snapshot_json
    max_age_days: 200
    source: fmp_key_metrics_ttm
    json_root: key_metrics_ttm
    keys:
      - marketCap
      - marketCapTTM

  shares_outstanding:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json
        source: fmp_key_metrics_ttm
        json_root: key_metrics_ttm
        keys:
          - sharesOutstanding
          - weightedAverageShsOutDilTTM
          - weightedAverageShsOutTTM
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, weightedAverageShsOutDil]

  revenue_ttm:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, revenue]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, totalRevenue]
      - type: table_column
        table: income_statements
        column: total_revenue
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  # Forward (next unreported FY) consensus revenue — the base the street
  # actually prices hypergrowth names on. Without it, EV/S on trailing
  # sales collapses ramping names (NBIS: $1.36B TTM vs $3.34B FY26E).
  revenue_forward:
    type: coalesce
    max_age_days: 200
    sources:
      - type: forward_estimate
        column: revenue_estimate

  # multi-year analyst EPS estimate window (point-in-time) —
  # feeds the peg_r40_cagr method ported from v1
  eps_est_start:
    type: eps_estimate_series
    field: start_eps
    max_age_days: 200

  eps_est_end:
    type: eps_estimate_series
    field: end_eps
    max_age_days: 200

  eps_est_years:
    type: eps_estimate_series
    field: years
    max_age_days: 200

  eps_est_analysts:
    type: eps_estimate_series
    field: analysts
    max_age_days: 200

  # --- P1 diagnostics -------------------------------------------------
  # mid-cycle net margin — multi-period average so EV/S does not
  # capitalize a cyclical peak margin as sustainable
  net_profit_margin_midcycle:
    type: coalesce
    max_age_days: 800
    sources:
      - type: table_column_avg
        table: financial_ratios
        column: net_profit_margin
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        rows: 12

  # dilution overhang — diluted vs basic share count; the embedded
  # option/RSU claim on today's equity
  shares_diluted:
    type: coalesce
    max_age_days: 200
    sources:
      - type: table_column
        table: fundamental_quarterly
        column: shares_diluted
        as_of: filing_date
        order_by: filing_date
        where_not_null: true
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, weightedAverageShsOutDil]

  shares_basic:
    type: coalesce
    max_age_days: 200
    sources:
      - type: table_column
        table: share_float
        column: shares_outstanding
        as_of: float_date
        order_by: float_date
        where_not_null: true
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, weightedAverageShsOut]

  dilution_overhang:
    type: derived
    max_age_days: 200
    name: ratio
    params:
      numerator: {type: feature_ref, name: shares_diluted}
      denominator: {type: feature_ref, name: shares_basic}

  # accrual quality — operating cash conversion of reported earnings
  ocf_ttm:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, cash_flow, 0, operatingCashFlow]
      - type: table_column
        table: cash_flow_statements
        column: operating_cash_flow
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  net_income_ttm:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, income, 0, netIncome]
      - type: table_column
        table: income_statements
        column: net_income
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  cash_conversion:
    type: derived
    max_age_days: 200
    name: ratio
    params:
      numerator: {type: feature_ref, name: ocf_ttm}
      denominator: {type: feature_ref, name: net_income_ttm}

  fcf_ttm:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, cash_flow, 0, freeCashFlow]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, cash_flow, 0, freeCashFlowTTM]
      - type: table_column
        table: cash_flow_statements
        column: free_cash_flow
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  cash_and_equivalents:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, balance, 0, cashAndCashEquivalents]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, balance, 0, cashAndShortTermInvestments]
      - type: table_column
        table: balance_sheets
        column: cash_and_cash_equivalents
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  total_debt:
    type: coalesce
    max_age_days: 400
    sources:
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, balance, 0, totalDebt]
      - type: snapshot_json_path
        source: fmp_fundamentals
        path: [fundamentals, statements, balance, 0, longTermDebt]
      - type: table_column
        table: balance_sheets
        column: long_term_debt
        as_of: fiscal_date_ending
        order_by: fiscal_date_ending
        where_not_null: true

  forward_growth:
    type: coalesce
    max_age_days: 180
    sources:
      - type: snapshot_json
        source: fmp_fundamentals
        json_root: analyst_estimates
        keys:
          - epsGrowth
          - epsGrowthNextYear
          - epsEstimatedGrowth
          - estimatedEpsGrowth
      - type: derived
        name: growth_from_eps_forward_and_eps_ttm
        params:
          eps_forward:
            type: coalesce
            max_age_days: 150
            sources:
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, eps_forward]
              - type: snapshot_json
                source: fmp_key_metrics_ttm
                json_root: key_metrics_ttm
                keys:
                  - epsForward
                  - epsForwardTTM
                  - epsNextYear
                  - epsEstimatedNextYear
          eps_ttm:
            type: coalesce
            max_age_days: 150
            sources:
              - type: snapshot_json
                source: fmp_key_metrics_ttm
                json_root: key_metrics_ttm
                keys:
                  - netIncomePerShareTTM
                  - epsTTM
                  - epsDilutedTTM
                  - eps
                  - netIncomePerShare
                  - netIncomePerShareTTM
                  - earningsPerShareTTM
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, eps_trailing]
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, eps]
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, statements, income, 0, epsDiluted]
              - type: snapshot_json_path
                source: fmp_fundamentals
                path: [fundamentals, statements, income, 0, eps]

  forward_growth_pct_1y:
    type: derived
    max_age_days: 180
    name: growth_pct_from_forward_growth
    params:
      growth:
        type: coalesce
        sources:
          - type: snapshot_json
            source: fmp_fundamentals
            json_root: analyst_estimates
            keys:
              - epsGrowth
              - epsGrowthNextYear
              - epsEstimatedGrowth
              - estimatedEpsGrowth
          - type: derived
            name: growth_from_eps_forward_and_eps_ttm
            params:
              eps_forward:
                type: coalesce
                max_age_days: 150
                sources:
                  - type: snapshot_json_path
                    source: fmp_fundamentals
                    path: [fundamentals, eps_forward]
                  - type: snapshot_json
                    source: fmp_key_metrics_ttm
                    json_root: key_metrics_ttm
                    keys:
                      - epsForward
                      - epsForwardTTM
                      - epsNextYear
                      - epsEstimatedNextYear
              eps_ttm:
                type: coalesce
                max_age_days: 150
                sources:
                  - type: snapshot_json
                    source: fmp_key_metrics_ttm
                    json_root: key_metrics_ttm
                    keys:
                      - netIncomePerShareTTM
                      - epsTTM
                      - epsDilutedTTM
                      - eps
                      - netIncomePerShare
                      - netIncomePerShareTTM
                      - earningsPerShareTTM
                  - type: snapshot_json_path
                    source: fmp_fundamentals
                    path: [fundamentals, eps_trailing]
                  - type: snapshot_json_path
                    source: fmp_fundamentals
                    path: [fundamentals, eps]
                  - type: snapshot_json_path
                    source: fmp_fundamentals
                    path: [fundamentals, statements, income, 0, epsDiluted]
                  - type: snapshot_json_path
                    source: fmp_fundamentals
                    path: [fundamentals, statements, income, 0, eps]

  tnx_yield:
    type: macro_column
    max_age_days: 45
    column: tnx_yield
    as_of: data_date

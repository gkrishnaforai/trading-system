version: 1

# Methods are selected by (category, regime). If there is no exact match,
# selection falls back to (category, default_regime) and then (default_category, default_regime)
# only if the fallback chain is explicitly configured.
#
# The middle step preserves the DETECTED regime at the default category:
# without it a pre-earnings name in a category with no pre_earnings cell
# (healthcare, consumer, unknown, future categories) fell to
# (value, standard) — PE/EV-FCF methods that refuse on negative EPS/FCF,
# leaving the run unpriced instead of routing to the survival tree.

default_category: value
default_regime: standard

fallback_chain:
  - {category: "{category}", regime: "{default_regime}"}
  - {category: "{default_category}", regime: "{regime}"}
  - {category: "{default_category}", regime: "{default_regime}"}

selections:
  financials:
    bank:
      combine: weighted_average
      methods:
        - method_key: pb_bank
          weight: 1.0

  ai_infra:
    standard:
      combine: weighted_average
      methods:
        - method_key: pe_technology_dynamic
          weight: 0.85
        - method_key: ev_fcf
          weight: 0.15

    cyclical:
      combine: weighted_average
      methods:
        - method_key: pe_cyclical
          weight: 0.7
        - method_key: pe_forward
          weight: 0.3

    mega_cap_high_growth:
      combine: weighted_average
      methods:
        - method_key: peg_corrected
          weight: 0.3
        - method_key: pe_technology_dynamic
          weight: 0.5
        - method_key: dcf_mega_cap
          weight: 0.2

    pre_earnings:
      combine: weighted_average
      methods:
        - method_key: ev_sales_survival
          weight: 0.7
        - method_key: ev_sales_growth
          weight: 0.3

    mega_cap:
      combine: weighted_average
      methods:

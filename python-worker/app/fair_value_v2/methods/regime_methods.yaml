version: 1

# Methods are selected by (category, regime). If there is no exact match,
# selection falls back to (category, default_regime) and then (default_category, default_regime)
# only if the fallback chain is explicitly configured.

default_category: value
default_regime: standard

fallback_chain:
  - {category: "{category}", regime: "{default_regime}"}
  - {category: "{default_category}", regime: "{default_regime}"}


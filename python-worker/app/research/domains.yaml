# Future Demand Capture — domain registry v1
# ===========================================
# The demand-side map: what the market will NEED (domains), who CAN
# supply it (layers → products), who CAPTURES the economics (FDCS).
# Need / Capability / Capture stay separate scores — domain heat
# never inflates a weak supplier's capability.
#
# d = domain opportunity seeds {growth, bottleneck, adoption,
# time_to_scale, strategic} — 0-100, versioned with the file (the
# PIT journal records domains@version on every run). The demand
# formula D_d = .30G+.25B+.20A+.15T+.10S is applied in fdce.py.
version: 1

label: "Future Demand Capture"

# ------------------------------------------------------------------
# Universe — symbols the FDCE evaluates, with primary/secondary
# domain assignment. Overlaps sector universes freely: a symbol
# runs its sector engine AND its domain eval in the same run.
# ------------------------------------------------------------------

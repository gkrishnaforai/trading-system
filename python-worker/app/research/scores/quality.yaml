# Quality score — v1
# ==================
# Ten qualitative dimensions, equal-weighted, 0-100 each (UI renders
# /10). Same _cond band engine — a missing input fails the band and
# lands in the missing log; no invented strengths. Bands are
# deterministic proxies for the qual dimension — the note states the
# reasoning so the UI can show 'why' verbatim.
version: 1

components:

  # ---- financial health — can the business fund itself? -----------
  financial_health:
    weight: 10
    bands:
      - {if: {fcf_ttm_gt: 0, nde_lt: 1}, score: 90,
         note: "FCF-positive with low net leverage — self-funding"}
      - {if: {fcf_ttm_gt: 0}, score: 75,
         note: "FCF-positive but leverage elevated"}
      - {if: {runway_quarters_gte: 8}, score: 55,
         note: "burning but >2y runway"}
      - {if: {runway_quarters_gte: 4}, score: 35,
         note: "runway under 2y — financing risk ahead"}
      - {if: {runway_quarters_lt: 4}, score: 15,
         note: "runway under 1y — financing event likely"}
      - {default: 40, note: "insufficient cash-flow evidence"}

  # ---- alignment — management↔shareholder incentives --------------
  alignment:
    weight: 10
    bands:
      - {if: {dilution_pct_lte: 0.02, driver_cuts: 0}, score: 80,
         note: "minimal dilution, no commitment cuts"}
      - {if: {dilution_pct_lte: 0.05}, score: 65,
         note: "dilution within tolerance"}
      - {if: {dilution_pct_gte: 0.10}, score: 25,
         note: "share count growing >10%/yr — value leaking to issuance"}
      - {default: 50, note: "dilution unknown — no basis either way"}

  # ---- profitability ----------------------------------------------
  profitability:
    weight: 10
    bands:
      - {if: {om_now_gte: 0.25, fcf_margin_gte: 0.20}, score: 95,
         note: "elite margins — op >25%, FCF >20%"}
      - {if: {om_now_gte: 0.15, fcf_margin_gte: 0.10}, score: 80,
         note: "healthy operating + cash margins"}
      - {if: {om_now_gte: 0.05}, score: 60,
         note: "profitable but thin"}
      - {if: {om_now_gte: 0}, score: 40,
         note: "breakeven — margins not yet proven"}
      - {if: {om_now_lt: 0}, score: 15,
         note: "operating at a loss"}
      - {default: 45, note: "margin data missing"}

  # ---- growth outlook ---------------------------------------------
  growth_outlook:
    weight: 10
    bands:
      - {if: {rev_growth_gte: 0.20, est_revision_pct_gte: 0}, score: 90,
         note: ">20% growth with neutral-or-better revisions"}
      - {if: {rev_growth_gte: 0.10}, score: 75,
         note: "double-digit growth"}
      - {if: {rev_growth_gte: 0.03}, score: 55,
         note: "modest growth"}
      - {if: {rev_growth_gte: -0.05}, score: 35,
         note: "flat-to-slightly-declining revenue"}
      - {if: {rev_growth_lt: -0.05}, score: 15,
         note: "revenue contracting"}
      - {default: 45, note: "growth data missing"}

  # ---- analyst sentiment — the street's direction, not level ------
  analyst_sentiment:
    weight: 10
    bands:
      - {if: {est_revision_pct_gte: 0.05}, score: 90,
         note: "estimates being raised materially"}
      - {if: {est_revision_pct_gte: 0.01}, score: 75,
         note: "revisions trending up"}
      - {if: {est_revision_pct_gte: -0.02}, score: 60,
         note: "revisions roughly flat"}
      - {if: {est_revision_pct_gte: -0.08}, score: 40,
         note: "revisions trending down"}
      - {if: {est_revision_pct_lt: -0.08}, score: 20,
         note: "estimates being cut materially"}
      - {default: 50, note: "no revision data"}

  # ---- business viability — does the model work? ------------------
  business_viability:
    weight: 10
    bands:
      - {if: {rev_products_gte: 2, moat_mechs_gte: 2}, score: 90,
         note: "multiple revenue products with real moat mechanisms"}
      - {if: {rev_products_gte: 1, moat_mechs_gte: 1}, score: 75,
         note: "revenue product with a defensible mechanism"}
      - {if: {rev_products_gte: 1}, score: 60,
         note: "sells today — moat unproven"}
      - {if: {rollout_products_gte: 1}, score: 45,
         note: "commercial rollout, not yet proven"}
      - {if: {pipeline_products_gte: 1}, score: 30,
         note: "pipeline only — viability is prospective"}
      - {default: 40, note: "no product map yet"}

  # ---- revenue quality — does the P&L convert to cash? ------------
  revenue_quality:
    weight: 10
    bands:
      - {if: {fcf_conversion_gte: 0.9, dilution_pct_lte: 0.03}, score: 90,
         note: "earnings backed by cash, minimal issuance"}
      - {if: {fcf_conversion_gte: 0.7}, score: 75,
         note: "reasonable cash conversion"}
      - {if: {fcf_conversion_gte: 0.4}, score: 55,
         note: "earnings outpacing cash — watch accruals"}
      - {if: {fcf_conversion_lt: 0.4}, score: 25,
         note: "reported earnings not converting to cash"}
      - {if: {fcf_ttm_gt: 0, rev_growth_gt: 0}, score: 70,
         note: "profitable and growing — conversion not computable"}
      - {default: 45, note: "conversion data missing"}

  # ---- market position --------------------------------------------
  market_position:
    weight: 10
    bands:
      - {if: {moat_mechs_gte: 3, gq_score_gte: 70}, score: 90,
         note: "deep moat + top structural-quality read"}
      - {if: {moat_mechs_gte: 2}, score: 75,
         note: "multiple moat mechanisms"}
      - {if: {moat_mechs_gte: 1}, score: 60,
         note: "one defensible mechanism"}
      - {if: {products_mapped_gte: 1}, score: 45,
         note: "products mapped, moat unproven"}
      - {default: 40, note: "position unassessed"}

  # ---- track record — does management deliver? --------------------
  track_record:
    weight: 10
    bands:
      - {if: {commit_tracked_gte: 3, commit_negative: 0}, score: 90,
         note: "clean delivery record across commitments"}
      - {if: {commit_tracked_gte: 3, commit_negative_lte: 1}, score: 70,
         note: "mostly delivers — isolated miss"}
      - {if: {commit_negative_gte: 2}, score: 25,
         note: "repeated missed/revised/delayed commitments"}
      - {if: {commit_tracked_gte: 1}, score: 55,
         note: "thin record — too few commitments to judge"}
      - {default: 50, note: "no commitment history"}

  # ---- capital allocation ------------------------------------------
  capital_allocation:
    weight: 10
    bands:
      - {if: {dilution_pct_lte: 0.01, fcf_ttm_gt: 0, nde_lt: 1},
         score: 90,
         note: "self-funding, ~no issuance, low leverage"}
      - {if: {dilution_pct_lte: 0.03, fcf_ttm_gt: 0}, score: 75,
         note: "disciplined issuance"}
      - {if: {dilution_pct_lte: 0.08}, score: 55,
         note: "moderate issuance"}
      - {if: {dilution_pct_gte: 0.08}, score: 25,
         note: "funding growth with shareholder equity"}
      - {default: 45, note: "issuance data missing"}

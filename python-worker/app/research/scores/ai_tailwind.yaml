# AI Tailwind Score — v1 (weights per spec)
# ==========================================
# Measures the company's ability to benefit from structural AI
# adoption — NOT whether the stock is cheap. Every component scores
# 0-100 via ordered bands; first matching band wins. Inputs are
# deterministic ctx fields; missing inputs score via `missing`
# default (0) and land in the missing log — never vacuous-true.
version: 1

components:
  # ---- 15% structural industry opportunity -------------------------
  structural_opportunity:
    weight: 15
    bands:
      # tailwind_review's bounded attribution — the closest journaled
      # answer to "is AI structurally driving this name"
      - {if: {ai_linkage: "ai_direct"}, score: 95,
         note: "AI is the growth engine"}
      - {if: {ai_linkage: "ai_indirect"}, score: 75,
         note: "AI-linked beneficiary"}
      - {if: {ai_linkage: "ai_adopter"}, score: 60,
         note: "applies AI to its workflow"}
      - {if: {opportunity_tagged: true}, score: 50,
         note: "sector taxonomy match, unconfirmed linkage"}
      - {if: {ai_linkage: "non_ai_cyclical"}, score: 20,
         note: "growth is cyclical, not structural AI"}
      - {default: 15, note: "no AI linkage evidence"}

  # ---- 20% product differentiation & AI capability -----------------
  product_differentiation:
    weight: 20
    bands:
      - {if: {moat_mechs_gte: 3}, score: 90,
         note: "3+ moat mechanisms across products"}
      - {if: {moat_mechs_gte: 2}, score: 75}
      - {if: {moat_mechs_gte: 1}, score: 55,
         note: "one real mechanism"}
      - {if: {products_mapped_gte: 1}, score: 35,
         note: "products exist, moat unproven"}
      - {default: 10, note: "no product map"}

  # ---- 15% measurable customer value -------------------------------
  customer_value_evidence:
    weight: 15
    bands:
      # driver commitments raised = customers/street repricing value
      - {if: {driver_raises_gte: 2}, score: 85}
      - {if: {driver_raises_gte: 1}, score: 70}
      - {if: {rev_growth_gte: 0.15}, score: 55,
         note: "value showing up in the numbers"}
      - {if: {products_mapped_gte: 1}, score: 30}
      - {default: 10}

  # ---- 15% commercial adoption & monetization ----------------------
  adoption_monetization:
    weight: 15
    bands:
      - {if: {rev_products_gte: 2, rev_growth_gte: 0.10}, score: 90,
         note: "multiple revenue products + growth"}
      - {if: {rev_products_gte: 1}, score: 70}
      - {if: {rollout_products_gte: 1}, score: 45,
         note: "commercial rollout, pre-scale"}
      - {if: {products_mapped_gte: 1}, score: 25,
         note: "pipeline only"}
      - {default: 10}

  # ---- 15% proprietary data / workflow / moat ----------------------
  moat:
    weight: 15
    bands:
      - {if: {moat_mechs_gte: 3}, score: 90}
      - {if: {moat_mechs_gte: 2}, score: 70}
      - {if: {moat_mechs_gte: 1}, score: 50}
      - {default: 15, note: "rented capability, no moat"}

  # ---- 10% competitive positioning & value capture -----------------
  competitive_positioning:
    weight: 10
    bands:
      - {if: {driver_cuts: 0, driver_raises_gte: 1,
              gq_score_gte: 70}, score: 85}
      - {if: {gq_score_gte: 60}, score: 65}
      - {if: {driver_cuts_gte: 1}, score: 25,
         note: "commitments being cut"}
      - {default: 40}

  # ---- 10% long-term runway & expansion ----------------------------
  runway_expansion:
    weight: 10
    bands:
      - {if: {pipeline_products_gte: 2}, score: 80,
         note: "multiple pipeline initiatives"}
      - {if: {pipeline_products_gte: 1}, score: 60}
      - {if: {emerging_growth: true}, score: 50,
         note: "forward-growth flag on"}
      - {default: 25}

# ------------------------------------------------------------------
# Caps — semantic ceilings no component sum can beat. First match.
# A company with NO AI linkage cannot post a high *tailwind* score
# on moat alone; linkage=unclear is capped lower than a verified
# one. Explicit null linkage → cap; absent field → bands already
# failed and coverage flags it.
# ------------------------------------------------------------------
caps:
  - {when: {ai_linkage_is: null}, cap: 40,
     note: "no AI linkage identified — moat is not tailwind"}
  - {when: {ai_linkage: unclear}, cap: 55,
     note: "linkage unverified"}
  - {when: {ai_linkage: non_ai_cyclical}, cap: 45,
     note: "growth is cyclical, not AI-driven"}

# Technical Entry — v1
# ====================
# "Is now a reasonable time to own it?" — journaled momentum regime
# + revision setup. Never a buy signal on its own; the gate layer
# decides. Missing momentum_state → coverage penalty, not a pass.
version: 1

components:

  regime_setup:                         # 55 — journaled regime
    weight: 55
    bands:
      - {if: {momentum_state: "breakout"}, score: 90,
         note: "breakout regime"}
      - {if: {momentum_state: "uptrend"}, score: 85,
         note: "confirmed uptrend"}
      - {if: {momentum_state: "pullback"}, score: 70,
         note: "uptrend pullback — constructive entry"}
      - {if: {momentum_state: "recovery"}, score: 60,
         note: "early recovery"}
      - {if: {momentum_state: "basing"}, score: 55,
         note: "basing — wait for confirm"}
      - {if: {momentum_state: "rolling_over"}, score: 35,
         note: "momentum rolling over"}
      - {if: {momentum_state: "downtrend"}, score: 20,
         note: "downtrend — no entry"}
      - {if: {momentum_state: "breakdown"}, score: 10,
         note: "breakdown"}
      - {if: {momentum_state: "capitulation"}, score: 15,
         note: "capitulation — watch, don't catch"}
      - {if: {momentum_state: "climax"}, score: 25,
         note: "climax — late"}

  revision_support:                     # 25 — setup backed by
    weight: 25                          # estimate moves
    bands:
      - {if: {est_revision_pct_gte: 0.03}, score: 100,
         note: "revisions accelerating the setup"}
      - {if: {est_revision_pct_gte: 0}, score: 65,
         note: "revisions not fighting the tape"}
      - {if: {est_revision_pct_lt: 0}, score: 30,
         note: "revisions against the setup"}

  growth_acceleration:                  # 20 — fundamental
    weight: 20                          # acceleration confirms tape
    bands:
      - {if: {rev_accel_gte: 0.05}, score: 100,
         note: "revenue accelerating"}
      - {if: {rev_accel_gte: 0}, score: 65,
         note: "growth stable/accelerating"}
      - {if: {rev_accel_lt: 0}, score: 30,
         note: "growth decelerating"}

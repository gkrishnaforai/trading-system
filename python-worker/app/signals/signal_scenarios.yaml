# Signal contract scenarios — behavioral regression table.
#
# Each scenario runs the REAL eval_use_case (the function the
# readiness board calls) against a synthetic row and asserts the
# verdict. Row keys are exactly what _normalize reads; momentum_detail
# folds in as the jsonb detail blob.
#
# These pin the gate semantics discovered in the board/plan audit —
# if a future 'fix' reopens a hole (a knife reading ready, a missing
# field passing a check), the eval suite fails loudly instead of the
# bad call shipping to the board.
#
# expect:
#   state_in / state_not_in — readiness verdict membership
#   must_pass / must_fail   — checklist line fragments that must
#                             carry ok=true / ok=false

- id: knife_hook_is_not_ready
  note: >-
    The MSTR bug — a knife printing an early dip hook read swing
    'ready' when the dip arm didn't require non-broken tape. A
    broken trend with a hook is a false bottom, not an entry.
  use_case: swing
  row:
    mom_state: knife
    vs_sma50: 0.08
    rsi: 42
    earn_days: 30
  momentum_detail:
    dip_phase: turning_up
    hist_dir: 0.2
    pct_b: 0.4
    swing: {phase: broken, confirm_level: 95.0}
  expect:
    state_not_in: [ready]

- id: capitulation_hook_is_not_ready
  note: >-
    Same hole, different broken state — capitulation + turning_up
    must not qualify through the dip arm either.
  use_case: swing
  row:
    mom_state: capitulation
    vs_sma50: 0.05
    rsi: 38
    earn_days: 20
  momentum_detail:
    dip_phase: turning_up
    hist_dir: 0.3
    pct_b: 0.3
    swing: {phase: broken, confirm_level: 80.0}
  expect:
    state_not_in: [ready]
    must_fail: ["constructive tape"]

- id: downtrend_stabilizing_is_not_ready
  note: >-
    Downtrend is tape_broken too — 'stabilizing' inside a downtrend
    is a pause, not a setup.
  use_case: swing
  row:
    mom_state: downtrend
    vs_sma50: -0.03
    rsi: 44
    earn_days: 40
  momentum_detail:
    dip_phase: stabilizing
    hist_dir: -0.1
    pct_b: 0.35
    swing: {phase: broken, confirm_level: 70.0}
  expect:
    state_not_in: [ready]
    must_fail: ["constructive tape"]

- id: rolling_over_resolving_can_be_ready
  note: >-
    Design intent — SOFT tape (rolling_over is tape_weak but not
    tape_broken) may qualify early when the dip is resolving. If
    this starts failing, the dip arm was over-tightened.
  use_case: swing
  row:
    mom_state: rolling_over
    vs_sma50: 0.04
    rsi: 50
    earn_days: 30
  momentum_detail:
    dip_phase: turning_up
    hist_dir: 0.1
    pct_b: 0.5
    swing: {phase: higher_low, confirm_level: 92.0}
  expect:
    state_in: [ready]
    must_pass: ["constructive tape"]

- id: pullback_resolving_is_ready
  note: >-
    The canonical dip-buy: constructive state + resolving wash +
    trend intact + structure mapped.
  use_case: swing
  row:
    mom_state: pullback
    vs_sma50: 0.06
    rsi: 52
    earn_days: 25
  momentum_detail:
    dip_phase: turning_up
    hist_dir: 0.15
    pct_b: 0.55
    swing: {phase: higher_low, confirm_level: 88.0}
  expect:
    state_in: [ready]

- id: missing_dip_phase_fails_check
  note: >-
    Missing-data contract — rolling_over isn't in
    swing_constructive, so it can only qualify via the dip arm;
    with no dip_phase that arm can't verify → check fails. 'Can't
    verify' is never 'clean'. (A pullback without dip_phase still
    passes via the tape arm — that's the OR design, not a hole.)
  use_case: swing
  row:
    mom_state: rolling_over
    vs_sma50: 0.06
    rsi: 52
    earn_days: 25
  momentum_detail:
    hist_dir: 0.15
    pct_b: 0.55
    swing: {phase: higher_low, confirm_level: 88.0}
  expect:
    state_not_in: [ready]
    must_fail: ["constructive tape"]

- id: leap_call_rejects_knife
  note: >-
    LEAP calls need trend support — knife is outside
    [pullback, uptrend, recovery] regardless of dip phase or
    fundamentals.
  use_case: leap_call
  row:
    mom_state: knife
    fund_state: accelerating
    rsi: 40
    earn_days: 30
  momentum_detail:
    dip_phase: turning_up
    pct_b: 0.4
  expect:
    state_not_in: [ready]
    must_fail: ["trend supports calls"]

- id: leap_call_clean_uptrend
  note: >-
    Canonical LEAP-call candidate: uptrend + resolving dip +
    accelerating fundamentals + not euphoric.
  use_case: leap_call
  row:
    mom_state: uptrend
    fund_state: accelerating
    rsi: 55
    earn_days: 30
  momentum_detail:
    dip_phase: turning_up
    pct_b: 0.6
  expect:
    state_in: [ready]

- id: invest_rejects_knife_entry
  note: >-
    Even with perfect fundamentals, hostile entry tape (knife) must
    block the long-hold checklist — the 'price not hostile' check.
  use_case: invest
  row:
    mom_state: knife
    fund_state: accelerating
    rev_growth: 0.25
    eps_growth: 0.30
    future_score: 70
    gq_score: 65
    fv_upside: -5
    revision_grade: "B+"
    is_etf: false
    earn_days: 30
  expect:
    state_not_in: [ready]
    must_fail: ["price not hostile"]

# ------------------------------------------------------------------
# posture engine — permission-layer semantics (the fail-closed class)
# ------------------------------------------------------------------

- id: posture_breadth_collapse_closes_longs
  note: >-
    The fail-open bug class pinned at the engine level — collapsed
    breadth must deny new longs, not default to them.
  engine: posture
  payload:
    breadth: {breadth_score: 15}
  expect:
    state_in: [defensive]
    field_eq: {new_longs: false}

- id: posture_defensive_stance_closes_longs
  engine: posture
  stance: DEFENSIVE
  payload: {}
  expect:
    state_in: [defensive]
    field_eq: {new_longs: false}

- id: posture_empty_payload_uses_declared_default
  note: >-
    No rule matching → falls to the YAML `default:` block — the
    declared policy, not a code fallback. If this ever returns a
    posture the YAML didn't write, the default chain changed.
  engine: posture
  payload: {}
  expect:
    field_eq: {matched: "default", posture: "neutral"}

# ------------------------------------------------------------------
# leveraged swings — leg-role semantics (armed/trigger/easing/veto)
# ------------------------------------------------------------------

- id: soxl_rebound_triggers_on_reclaim
  note: >-
    Canonical trigger path: washed + at support (armed) + 8EMA
    reclaim (trigger) + easing quorum → triggered.
  engine: lev
  etf: SOXL
  ctx:
    rsi: 34
    rsi_lo7: 25
    near_support: true
    swing_low: 40.0
    support_window: 20
    support_pct_disp: "5%"
    above_8ema: true
    rsi_dir: 0.5
    higher_low: true
    vol_dip: 0.8
    bear_alerts: 0
    catalyst_veto_at: 2
  expect:
    state_in: [triggered]

- id: soxl_vetoed_on_bearish_catalysts
  note: >-
    The thesis veto fires even when every entry leg is green —
    2+ fresh bearish semis catalysts = deteriorating thesis.
  engine: lev
  etf: SOXL
  ctx:
    rsi: 34
    rsi_lo7: 25
    near_support: true
    swing_low: 40.0
    support_window: 20
    support_pct_disp: "5%"
    above_8ema: true
    rsi_dir: 0.5
    higher_low: true
    vol_dip: 0.8
    bear_alerts: 2
    catalyst_veto_at: 2
  expect:
    state_in: [vetoed]

- id: soxl_flat_without_support_test
  note: >-
    No armed quorum → flat. A rebound with no support test is a
    bounce into air, not a setup.
  engine: lev
  etf: SOXL
  ctx:
    rsi: 45
    rsi_lo7: 38
    near_support: false
    swing_low: 40.0
    support_window: 20
    support_pct_disp: "5%"
    above_8ema: true
    rsi_dir: 0.5
    higher_low: true
    vol_dip: 0.8
    bear_alerts: 0
    catalyst_veto_at: 2
  expect:
    state_in: [flat]

# ------------------------------------------------------------------
# plan status — rule ordering + missing-data semantics
# ------------------------------------------------------------------

- id: plan_stop_hit_fires
  engine: plan_status
  ctx:
    risk_hit: true
    pulse_action: "hold"
    stop: 92.0
  expect:
    state_in: [stop_hit]

- id: plan_thesis_dead_beats_stop_ordering
  note: >-
    Rule order matters — thesis_invalidated is FIRST so a reduce/
    avoid pulse wins over every price-based rule. If ordering
    flips, this pins the regression.
  engine: plan_status
  ctx:
    pulse_action: "reduce"
    risk_hit: true
    t1_hit: true
    stop: 92.0
    t1: 110.0
  expect:
    state_in: [invalidated]

- id: plan_empty_ctx_defaults_on_track
  note: >-
    Missing ctx fields can't trigger any price/status rule — the
    default catch-all owns them. 'Can't verify' → on_track, never
    a phantom invalidation.
  engine: plan_status
  ctx: {}
  expect:
    state_in: [on_track]

# ------------------------------------------------------------------
# best_picks — gate semantics
# ------------------------------------------------------------------

- id: best_picks_gates_broken_tape
  note: >-
    The same knife that readiness now refuses must also be gated
    out of the picks lane — gate parity across engines.
  engine: best_picks
  sleeve: growth_swing
  ctx:
    new_longs: true
    momentum_age_days: 1
    is_etf: false
    tape: knife
  expect:
    state_in: [gated]
    field_eq: {gate: "tape_broken"}

- id: best_picks_gates_unknown_permission
  note: >-
    posture_closed fires on missing new_longs — can't-verify
    permission is a veto, not a pass.
  engine: best_picks
  sleeve: growth_swing
  ctx:
    momentum_age_days: 1
    is_etf: false
    tape: pullback
  expect:
    state_in: [gated]
    field_eq: {gate: "posture_closed"}

# Competitive Disruption & Substitution Engine — v1
# ==================================================
# "Does this name capture the industry's growth, or lose share inside
# it?" Six resilience legs (uniform direction: 100 = protected),
# scored deterministically over an APPROVED-claims journal — threats
# arrive with stage + share ranges + source dates; announcements can't
# sink a moat (pre-production evidence caps a leg at 60, never lower).
# Opportunity-direction threats (AVGO/MRVL insourcing benefit)
# accumulate into opportunity_credit, never into risk.
version: 1

stage_multiplier:                 # announcements are not production
  announced: 0.10
  prototype: 0.25
  design_win: 0.40
  qualification: 0.55
  production: 0.80
  scaled: 1.00

# displacement_confirmed — the ONLY state that can move a decision.
# Deliberately hard to reach: production-or-later stage AND a sized
# share floor AND even odds.
displacement_when:
  stage_in: production_stages
  share_lo_gte: 0.15
  probability_gte: 0.50

groups:
  production_stages: [production, scaled]
  pre_production_stages: [announced, prototype, design_win,
                          qualification]

# exposure = share_mid x probability x stage_mult, summed over
# approved threat-direction claims in the type's set.
exposure_types:
  substitution_resist: [substitution, platform, open_source,
                        geo_localization, pricing]
  insourcing_resist:   [insourcing]

components:

  substitution_resist:            # 20 — how much revenue can be replaced
    weight: 20
    bands:
      - {if: {threat_exposure_gte: 0.35}, score: 15,
         note: ">35% of revenue pools under sized threat"}
      - {if: {threat_exposure_gte: 0.20}, score: 30,
         note: "20-35% pool exposure"}
      - {if: {threat_exposure_gte: 0.10}, score: 50,
         note: "10-20% pool exposure"}
      - {if: {threat_exposure_gte: 0.05}, score: 65,
         note: "5-10% pool exposure"}
      - {if: {threat_exposure_gt: 0}, score: 78,
         note: "documented threats, small exposure"}
      - {if: {threat_exposure: 0, threats_n_gte: 1}, score: 80,
         note: "documented threats are insourcing-type only"}
      - {if: {durability_rank_gte: 4, threats_n: 0}, score: 80,
         note: "no documented threats; contracted demand"}
      - {if: {durability_rank_gte: 3, threats_n: 0}, score: 70,
         note: "no documented threats; recurring base"}
      - {if: {threats_n: 0}, score: 60,
         note: "no documented threats — unverified, not safe"}

  competitive_position:           # 20 — incumbent wins vs rivals
    weight: 20
    bands:
      - {if: {competitor_prod_n_gte: 2}, score: 25,
         note: "2+ rivals already in production"}
      - {if: {competitor_prod_n_gte: 1}, score: 40,
         note: "a rival reached production"}
      - {if: {design_wins_n_gte: 3}, score: 85,
         note: "multiple incumbent design wins"}
      - {if: {design_wins_n_gte: 1}, score: 70,
         note: "documented design wins"}
      - {if: {competitor_qual_n_gte: 2}, score: 45,
         note: "multiple rivals in qualification"}
      - {if: {competitor_qual_n_gte: 1}, score: 58,
         note: "a rival in qualification"}

  insourcing_resist:              # 15 — can customers build it?
    weight: 15
    bands:
      - {if: {insource_exposure_gte: 0.25, top1_pct_gte: 0.30}, score: 15,
         note: "heavy insourcing exposure on concentrated customers"}
      - {if: {insource_exposure_gte: 0.25}, score: 25,
         note: "heavy insourcing exposure"}
      - {if: {insource_exposure_gte: 0.10, top1_pct_gte: 0.30}, score: 35,
         note: "insourcing risk on concentrated base"}
      - {if: {insource_exposure_gte: 0.10}, score: 50,
         note: "documented insourcing threat"}
      - {if: {insource_exposure_gt: 0}, score: 65,
         note: "small insourcing exposure"}
      - {if: {top1_pct_gte: 0.40}, score: 45,
         note: "concentrated customers — insourcing substrate"}
      - {if: {insource_threats_n: 0, top1_pct_lt: 0.20}, score: 75,
         note: "no insourcing claims, diversified base"}

  technology_moat:                # 15 — how hard to replicate
    weight: 15
    bands:
      - {if: {bottleneck_mechs_gte: 2}, score: 95,
         note: "multiple bottleneck mechanisms"}
      - {if: {bottleneck_mechs_gte: 1}, score: 80,
         note: "a bottleneck-grade mechanism"}
      - {if: {moat_mechs_gte: 2}, score: 70,
         note: "multiple moat mechanisms"}
      - {if: {moat_mechs_gte: 1}, score: 55,
         note: "one documented moat mechanism"}
      - {if: {rd_rev_gte: 0.20}, score: 65,
         note: "heavy R&D reinvestment"}
      - {if: {rd_rev_gte: 0.10}, score: 55,
         note: "solid R&D intensity"}
      - {if: {nextgen_stage_rank_gte: 4}, score: 60,
         note: "next-gen already in production"}

  ecosystem_switching:            # 15 — how hard to migrate away
    weight: 15
    bands:
      - {if: {durability_rank_gte: 4}, score: 90,
         note: "contracted — migration is expensive"}
      - {if: {durability_rank_gte: 3, crpo_share_gte: 0.40}, score: 80,
         note: "recurring demand, near-term book locked"}
      - {if: {durability_rank_gte: 3}, score: 68,
         note: "recurring demand base"}
      - {if: {platform_threat_prod: true}, score: 35,
         note: "platform alternative already in production"}
      - {if: {durability_rank_gte: 2}, score: 55,
         note: "usage-based — customers can drift"}
      - {if: {durability_rank_gte: 1}, score: 40,
         note: "replacement-cycle dependence"}
      - {if: {durability_rank_lt: 1}, score: 25,
         note: "discretionary/speculative demand — weak lock-in"}

  value_capture:                  # 15 — can economics survive pressure
    weight: 15
    bands:
      - {if: {pricing_threat_prod: true, om_slope_lt: 0}, score: 20,
         note: "pricing pressure + margins already falling"}
      - {if: {om_slope_gte: 0.05, fcf_margin_gte: 0.20}, score: 90,
         note: "margins expanding — pricing power intact"}
      - {if: {om_slope_gte: 0.02}, score: 75,
         note: "margins improving"}
      - {if: {fcf_margin_gte: 0.25}, score: 70,
         note: "high FCF margin cushions pressure"}
      - {if: {om_slope_gte: 0, margin_trend_gte: 1}, score: 60,
         note: "margins holding"}
      - {if: {pricing_threat_prod: true}, score: 40,
         note: "documented pricing pressure in production"}
      - {if: {om_slope_lt: 0}, score: 35,
         note: "margins already compressing"}

caps:
  - {when: {threat_exposure_gte: 0.30}, cap: 45,
     note: "high confirmed substitution exposure caps resilience"}
  - {when: {displacement_confirmed: true}, cap: 35,
     note: "production-stage displacement confirmed"}


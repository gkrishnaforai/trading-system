# leveraged_swings.yaml — declarative spec for the 3x-semiconductor
# swing detector (leveraged_swings.py). v1.1
#
# The engine builds a ctx of index-tape features + leadership +
# catalyst context, then evaluates each ETF's legs through
# pulse_engine._cond — the SAME condition semantics as the pulse and
# best-picks engines (field_gte / field_lt / bare bool / any / all).
# Thresholds, leg roles, veto and geometry are POLICY — they live
# here, not in the code. Mechanics (EMA/RSI math, index→ETF stop
# translation, journaling) stay in Python.
#
# Sequence semantics: RSI and vs50 extremes are 7-bar RECENT peaks
# (rsi_hi7 / rsi_lo7 / vs50_hi7), not same-bar values — 'RSI reaches
# 75-80, then closes below the 8EMA' is a sequence; by the trigger
# bar the current RSI has moved off the extreme.
#
# Risk contract (the stop math is approximate by design): the index
# level is the technical invalidation; the ETF stop is estimated via
# idx_move × leverage × stop_buffer — a CONSERVATIVE linear map, not
# an exact multi-day path (daily resets, tracking error and gaps all
# cut against you). risk_pct is a PLANNED-loss estimate, never a
# guarantee. geometry_invalid fires when the implied loss is wider
# than max_etf_stop_pct — an unpriceable stop is no signal.
version: "1.4"

signal_src: SMH              # closest liquid proxy to the index
signal_confirm: SOXX         # corroboration legs — validate before
                             # promoting any to armed
leverage: 3.0                # daily-reset multiple for the stop map
stop_buffer: 1.15            # stress factor on the 3x map — modeled
                             # fills are always better than real ones
max_etf_stop_pct: 0.15       # implied ETF stop wider than this →
                             # not actionable (an unpriceable stop is
                             # no signal; backtest sweeps this bound)
max_notional_pct: 0.10       # notional cap — risk-based sizing alone
                             # lets a tight stop inflate the position
                             # far past sane exposure
extreme_window: 7            # bars of recent-peak lookback
support_window: 60           # bars for the prior-swing support level
support_pct: 0.05            # 'near' = within 5% above the swing low
swing_hi_window: 20          # bars for the failed-high / breakout read
min_bars: 60                 # required index history
max_stale_days: 3            # index tape older than this → no signal

# 0.25-0.5% planned-loss band while the strategy is validated;
# default sits mid-band, callers may pass funds + risk_pct
risk_pct: 0.0035

# exit contract — declared, not yet engine-enforced (positions are
# not tracked; daily review does the enforcing). Grading target for
# the backtest: does a 5-8 bar time stop help expectancy?
max_hold_bars: 8
time_stop: "exit if the move hasn't resolved by max_hold_bars"
targets:
  - {r: 1.5, close: 0.50}    # first partial — bank half at 1.5R
  - {r: 2.0, close: 0.25}    # second partial at 2R; remainder trails

# semis leadership tape — whichever exist in stocks.momentum_state
# count toward the "leaders weakening / broad participation" legs.
# STRICT constructive set: only genuine trend states; climax is
# exhaustion, pullback/basing/recovery are neutral.
leaders: [NVDA, AVGO, TSM, AMD, QCOM, MU, INTC, ASML, TXN, ARM, ANET]
constructive_states: [uptrend, breakout]
hostile_states: [rolling_over, downtrend, breakdown, knife, capitulation]
min_leader_coverage: 0.7     # thinner tape → leaders_ratio missing,
                             # legs fail closed (unknown ≠ healthy)

# recent HIGH-materiality NEGATIVE alerts on semis — a single alert
# is soft evidence; >=2 inside the window is treated as a thesis-
# deterioration veto for SOXL. A FAILED query → bear_alerts missing
# → legs fail closed, never silently zero.
catalyst_window_days: 5
catalyst_veto_at: 2
catalyst_symbols_extra: [SMH, SOXX, SOXL, SOXS]

# leaders reporting within this window = overnight-gap risk note
earnings_window_days: 3

# state derivation — fixed contract, declared so it can't drift:
#   vetoed    all armed legs pass AND any veto leg fires
#   triggered all armed legs pass AND all trigger legs pass AND
#             easing legs meet easing_min (when declared)
#   armed     all armed legs pass
#   flat      otherwise
# 'soft' legs never gate — they're shown as preferred evidence.
#
# actionable — a SEPARATE contract from state. state describes the
# setup's technical shape; actionable = triggered AND every
# required_ctx field is present AND the stop geometry prices
# (idx_move > 0, implied loss <= max_etf_stop_pct). A triggered
# state with missing catalyst data or an unpriceable stop is a
# journaled hypothesis, never an actionable one.
#
# 'persisting' on a row = same state as the prior journal entry —
# the dedupe contract: a fresh trigger informs, a persisted one
# does not re-alert.

etfs:

  SOXS:
    label: "fade the extension — bet semis pull back"
    # index invalidation: reclaim of the recent swing high.
    # adverse idx_move = idx_stop/close - 1 (a RISE hurts the
    # inverse product) → etf_stop = entry*(1 - idx_move*lev*buffer)
    stop: {side: high, window: 10}
    # leaders unreadable → the breadth veto can't be verified →
    # not actionable (unknown breadth is not healthy breadth)
    required_ctx: [leaders_ratio]
    veto_reason: "sector breaking out on broad participation"
    legs:
      - {id: rsi_hot,    role: armed,
         when: {rsi_hi7_gte: 75},
         line: "index RSI {rsi} now / {rsi_hi7} 7-bar peak >= 75 (75-80 zone)"}
      - {id: stretched,  role: armed,
         when: {vs50_hi7_gte: 0.08},
         line: "{vs50_pct}% vs 50dma now / {vs50_hi7_pct}% 7-bar peak (>=+8% stretch)"}
      - {id: roll,       role: trigger,
         when: {below_8ema: true},
         line: "close below 8EMA (the roll-over trigger)"}
      - {id: failed_hi,  role: soft,
         when: {hi20_age_lte: 5, close_lt_hi20: true},
         line: "failed 20d high within 5 bars (preferred)"}
      - {id: soxx_conf,  role: soft,
         when: {soxx_below_8ema: true},
         line: "SOXX confirms the roll (corroboration — unvalidated)"}
      # a FRESH 20d high + price still near it (breakout intact, not
      # failed) + broad strict leadership = the breakout regime
      # persists into today's pullback — veto
      - {id: no_broad,   role: veto,
         when: {hi20_age_lte: 5, pct_off_hi20_gte: -0.03,
                leaders_ratio_gte: 0.6},
         line: "no intact broad breakout ({leaders_ratio_pct} leaders constructive)"}

    # sell-timing read for an EXISTING SOXS position — roles:
    # exit (invalidated or healed), profit (the move matured — bank
    # it), hold (the roll is still working). Verdict precedence:
    # exit > profit > hold > watch. Not position-aware — it's 'if
    # you own the thesis from a recent trigger, here's the tape'.
    hold_legs:
      - {id: stop,       role: exit,
         when: {above_stop10: true},
         line: "index closed above the 10d swing high — invalidation"}
      - {id: healed,     role: exit,
         when: {above_8ema: true},
         line: "index reclaimed the 8EMA — the roll healed"}
      - {id: norm,       role: profit,
         when: {near_sma50: true},
         line: "index back at the 50dma — the extension normalized"}
      - {id: exhausted,  role: profit,
         when: {rsi_lte: 35},
         line: "index RSI washed to 35 — the fade played out"}
      - {id: working,    role: hold,
         when: {below_8ema: true},
         line: "index still under the 8EMA — the roll is working"}

  SOXL:
    label: "confirmed rebound — bet semis recover"
    # index invalidation: loss of the rebound low.
    # adverse idx_move = close/idx_stop - 1 (a DROP hurts the long
    # product) → etf_stop = entry*(1 - idx_move*lev*buffer)
    stop: {side: low, window: 10}
    # catalyst feed unreadable → 'no alerts' can't be verified →
    # not actionable (a broken feed is not a clean feed)
    required_ctx: [bear_alerts]
    veto_reason: "multiple fresh bearish catalysts — thesis deteriorating"
    easing_min: 2
    legs:
      - {id: washed,     role: armed,
         when: {rsi_lo7_lt: 30},
         line: "index RSI {rsi} now / {rsi_lo7} 7-bar low < 30"}
      - {id: support,    role: armed,
         when: {near_support: true},
         line: "within {support_pct_disp} of {support_window}d swing low ({swing_low})"}
      - {id: reclaim,    role: trigger,
         when: {above_8ema: true},
         line: "close back above 8EMA (the reclaim trigger)"}
      - {id: rsi_turn,   role: easing,
         when: {rsi_dir_gt: 0},
         line: "RSI hooking up"}
      - {id: low_seq,    role: easing,
         when: {higher_low: true},
         line: "higher lows forming"}
      - {id: dry_vol,    role: easing,
         when: {vol_dip_lt: 1.0},
         line: "recent down-day volume below the selloff's pace"}
      - {id: higher_low, role: soft,
         when: {higher_low: true},
         line: "higher low vs prior swing (preferred over a lone hammer)"}
      - {id: catalyst,   role: soft,
         when: {bear_alerts: 0},
         line: "no fresh bearish catalyst alerts on semis"}
      - {id: soxx_conf,  role: soft,
         when: {soxx_above_8ema: true},
         line: "SOXX confirms the reclaim (corroboration — unvalidated)"}
      - {id: thesis_ok,  role: veto,
         when: {bear_alerts_gte: 2},
         line: "fewer than {catalyst_veto_at} fresh bearish catalysts"}

    # sell-timing read for an EXISTING SOXL position — same
    # exit > profit > hold > watch precedence
    hold_legs:
      - {id: stop,       role: exit,
         when: {below_stop10: true},
         line: "index lost the rebound low — invalidation"}
      - {id: failed_rec, role: exit,
         when: {below_8ema: true},
         line: "index lost the 8EMA again — the reclaim failed"}
      - {id: matured,    role: profit,
         when: {rsi_gte: 55},
         line: "index RSI back above 55 — the rebound matured"}
      - {id: at_50dma,   role: profit,
         when: {near_sma50: true},
         line: "index reached the 50dma — rebound into resistance"}
      - {id: working,    role: hold,
         when: {above_8ema: true},
         line: "index still above the 8EMA — the reclaim holds"}
      - {id: confirmed,  role: hold,
         when: {higher_low: true},
         line: "a higher low is in place"}

caveat: "SMH/SOXX proxy the NYSE Semiconductor Index; SOXL/SOXS compound daily — multi-day returns diverge from 3x. Stops are modeled, not guaranteed; gap risk is real. Grading the journal is the proof, not the RSI."
